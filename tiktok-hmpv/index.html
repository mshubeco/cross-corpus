s de toi, bonne nouvelle, tu peux te protéger. Lave-toi souvent les mains, évite de toucher ton visage et si quelqu'un tousse près de toi, garde tes distances. Mais surtout, si tu te sens malade, reste chez-toi pour protéger les autres. Alors tu connaissais le hmpv, maintenant tu es au courant. Partage cette vidéo pour que tout le monde reste informé et en bonne santé. Prenez soin de vous !"}, {"id": "7461682011267157280", "user": "aek.stem.academy", "at": "2025-01-19T17:37:11+00:00", "desc": "HMPV : Nouvelle épidémie 💉😷 ou tendance TikTok ? 📲🤔#HMPV#virus #santé", "views": 287, "likes": 6, "comments": 0, "shares": 0, "tags": ["virus", "santé", "hmpv"], "dur": 87, "voice": ""}, {"id": "7461678953003044118", "user": "miklinc4", "at": "2025-01-19T17:25:19+00:00", "desc": "#nouveauvirus  nouveau virus HMPV ECOUTEZ BIEN!! #2025  #confinement  #hmpv ", "views": 5, "likes": 0, "comments": 0, "shares": 0, "tags": ["confinement", "2025", "hmpv", "nouveauvirus"], "dur": 98, "voice": ""}, {"id": "7461636587319840033", "user": "healthy_vibes90", "at": "2025-01-19T16:30:00+00:00", "desc": "Le virus HMPV #santépourtous🍀 #vulgarisation #etudienteinfirmirmiere #etudiantmedecine #ifsi #HMPV", "views": 11705, "likes": 215, "comments": 3, "shares": 30, "tags": ["ifsi", "hmpv", "vulgarisation", "etudiantmedecine", "etudienteinfirmirmiere", "santépourtous🍀"], "dur": 67, "voice": "Le H M P. E. V ou virus humain métapneumovirus est 1 virus respiratoire responsable d'infection des voies respiratoires. Il se transmet par les gouttelettes projetées lors de la toux ou des éternuements, par contact direct avec 1 personne infectée ou par des surfaces contaminées. Les infections causées par le hmpv se manifestent par des symptômes similaires à ceux d'autres virus respiratoires, tel que la toux, le nez qui coule, la fièvre et parfois des difficultés respiratoires. Chez les personnes en bonne santé, l'infection est souvent bénigne, mais elle peut être plus grave chez les nourrissons, les personnes isonnalité : \t•\tLe HMPV est souvent plus actif en hiver et au printemps, tout comme le COVID-19 a montré des vagues liées à la saison froide dans certaines régions. \t4.\tDiagnostic et prévention : \t•\tLes deux nécessitent des tests spécifiques pour être identifiés (PCR ou tests rapides). \t•\tLes mesures de prévention (port du masque, lavage des mains, distanciation sociale) sont efficaces pour limiter leur propagation. Différences \t1.\tOrigine et structure : \t•\tSARS-CoV-2 : Un coronavirus, zoonotique, ayant émergé chez l’humain en 2019. \t•\tHMPV : Un paramyxovirus proche du virus respiratoire syncytial (RSV), connu depuis des décennies comme une cause courante de bronchites et pneumonies. \t2.\tGravité : \t•\tLe COVID-19 a causé une pandémie mondiale avec des millions de décès, des formes graves associées à des troubles systémiques (thromboses, défaillance multiorganique). \t•\tLe HMPV entraîne surtout des infections respiratoires bénignes, mais peut causer des pneumonies graves chez les populations à risque. \t3.\tVaccins et traitements : \t•\tPour le COVID-19, plusieurs vaccins existent, ainsi que des traitements antiviraux (comme le Paxlovid). \t•\tIl n’y a pas de vaccin spécifique ni de traitement antiviral approuvé pour le HMPV, bien que des recherches soient en cours. Pourquoi les relier est important ? Les épidémies récentes de HMPV coïncident parfois avec des vagues de COVID-19, surtout dans les périodes hivernales. Cela peut entraîner des diagnostics difficiles et une surcharge des systèmes de santé, car les deux virus affectent des populations similaires. Comprendre leur coexistence aide à améliorer : \t•\tLa gestion clinique : Identifier lequel des deux est responsable des symptômes pour un traitement adapté. \t•\tLa prévention : Maintenir des mesures comme le port du masque et la vaccination contre les maladies respiratoires graves. Si vous souhaitez approfondir un aspect particulier, je suis là pour vous aider !", "views": 17621, "likes": 168, ms similar to the flu or other respiratory infections cough, runny nose, sore throat, and sometimes severe pneumonia, particularly in children, the elderly, and individuals with weakened immune systems. Unlike coronavirus, metapneumovirus is less studied and poses a danger by causing more severe respiratory diseases. It has a different transmission mechanism and incubation period. There is currently no vaccine for HMPV, and treatment is limited to symptomatic care. The most vulnerable groups include young children, especially those under 2 years old, the elderly, and individuals with chronic lung or cardiovascular diseases. Patients with weakened immune systems are also at higher risk. Cases of monkeypox virus have already been reported in the United States, Canada, European countries, Asia, and Australia. The virus spreads quickly, particularly during the colder seasons. Take care of your health and the health of your loved ones. If you or your child experience respiratory symptoms, consult a doctor. Subscribe to medical notes for the latest medical information."}, {"id": "7458394798009912598", "user": "trend.news66", "at": "2025-01-10T21:01:06+00:00", "desc": "#france #santé #hmpv #contaminacion ", "views": 1496, "likes": 45, "comments": 9, "shares": 16, "tags": ["france", "contaminacion", "santé", "hmpv"], "dur": 55, "voice": "Vers 1 confinement provisoire décrété à partir du 05/02, l'OMS déclenche le plus au niveau d'alerte mondiale et décrète que le hmpv est 1 urgence de santé publique mondiale. Suite à cette déclaration officielle publiée il y a quelques heures, nous apprenons que le gouvernement se serait réuni pour 1 commission exceptionnelle de dernière minute afin de préparer le pays à 1 potentielle contamination. Pour le président Macron, il est impensable de revivre l'épisode Covid 1seconde fois, à déclarer le 1ère ministre François Bayrou. De son côté, Gérald Darmanin aurait indiqué que tous les moyens possibles vont être mis en place pour préparer le p ion reste dans la norme saisonnière. Contrairement au Covid 19, le hmpv ne représenterait pas 1 menace pandémique et sa présence est répandue dans le monde et la majorité de la population, il serait déjà immunisé grâce à des expositions passées. Si les précautions sanitaires restent essentielles, les experts, eux, soulignent qu'il n'y a pas lieu de paniquer et le véritable défi réside davantage dans la propagation de fausses informations qui peuvent raviver les peurs collectives."}, {"id": "7458024535388851479", "user": "oumabelwahid", "at": "2025-01-09T21:04:16+00:00", "desc": "#virus #hmpv #confinement #masque ", "views": 224, "likes": 6, "comments": 0, "shares": 0, "tags": ["virus", "masque", "confinement", "hmpv"], "dur": 69, "voice": ""}, {"id": "7458011716119481622", "user": "hugodecrypte", "at": "2025-01-09T20:14:31+00:00", "desc": "Réponse à @9  Le HMPV n’a pas de conséquence grave pour la plupart des gens mais il peut en avoir pour les personnes fragiles comme les enfants ou les personnes âgées. #sinformersurtiktok ", "views": 1463044, "likes": 87464, "comments": 1256, "shares": 7353, "tags": ["sinformersurtiktok"], "dur": 99, "voice": "Faut-il s'inquiéter du hmpv, ce virus comparé par certains au Covid 19 et qui se propage en Chine ? Et bien en France aujourd'hui. En tout cas pas vraiment. Je vous explique pourquoi. Bon, déjà, contrairement au Covid 19 à l'époque, ce virus qu'on voit aujourd'hui, il n'est pas inconnu, on le connaît depuis deux-mille-un. C'est en fait 1 virus dont les symptômes sont similaires à ceux d'un rhume ou d'une grippe. Comme la toux ou la fièvre, ça se propage par des gouttelettes projetées dans l'air lorsqu'une personne infectée tousse ou éternu lors d'un contact avec des surfaces contaminées par le virus. Le hmpv, il a pas de conséquences graves pour la majorité des gens, mais dans certains cas, pour les personnes les plus fragiles comme les enfants ou les personnes âgées, ça peut provoquer des maladies comme la bronchite ou la pneumonie. Alors comment expliquer maintenant les images que vous avez peut-être vu passer avec des hôpitaux surchargé de patients et cetera ? Bien, déjà attention car toutes les vidéos que vous voyez ne sont pas forcément des vidéos récentes. En effet, certaines de ces vidéos ont été prises en décembre deux-mille-vingt-deux, voir pendant l'épidémie de Covid 19. Alors maintenant, ce qui est vrai, c'est que contrairement à la grippe ou au Covid 19, il y a pas de vaccin pour ce prémunir de ce virus. En tout cas, ce mardi, l'organisation mondiale de la santé a pris la parole sur le sujet, a affirmé, je cite, que les autorités. Sanitaires chinoises n'ont reçu aucun rapport faisant état d'une évolution inhabituelle des épidémies et qu'il n'y a, je cite, pas eu de déclaration d'urgence déclenchée dans le pays. Parce que là aussi ça fait suite à 1 rumeur comme quoi il y avait 1 état d'urgence face à ce virus. La Chine aujourd'hui affirme que ce n'est qu'un pic saisonnier de hmpv en lien avec des températures basses et qui qui touche principalement les jeunes enfants et comme ça peut arriver, euh. Chaque année. Bref, à date aujourd'hui, avec les informations que l'on a, il n'y aurait pas de risque de propagation mondiale, ni la menace d'un confinement ou quoi que ce soit. N'hésitez pas en tout cas je vous avez des questions ?"}, {"id": "7458004061904850198", "user": "memeaddict57", "at": "2025-01-09T19:44:50+00:00", "desc": "#fyp #pourtoi #confinement #virus #covid19 #hmpv ", "views": 659, "likes": 85, "comments": 2, "shares": 1, "tags": ["virus", "fyp", "pourtoi", "confinement", "hmpv", "covid19"], "dur": 21, "voice": ""}, {"id": "7457997904771386646", "user": "dhya1353", "at": "2025-01-09T19:20:56+00:00", "desc": "Les autorités françaises se sont réunies en urgence pour discuter de la menace du virus HMPV, qui se rapproche de la France. !! Ce virus respiratoire dangereux pourrait entraîner un confinement si sa propagation devient incontrôlable. Une décision pourrait être a thout treatment or medication and this disaster and this nightmare, which has lasted until now for 3 centuries (300 years). 🗣️📢🆘help us fight COPD🫀🫁 #medicine #medical #copd #bpco #epoc #disease #asthma #asthme #asthmatic #vrs #hmpv #grippe #lungcancer #lungs #f #respiracion #pneumonia #lung #tuberculosis #pourtoi  #creatorsearchinsights ", "views": 1487, "likes": 247, "comments": 8, "shares": 4, "tags": ["f", "medicine", "asthma", "lung", "medical", "disease", "lungs", "asthmatic", "tuberculosis", "pneumonia", "pourtoi", "lungcancer", "vrs", "respiracion", "grippe", "epoc", "copd", "asthme", "hmpv", "bpco", "creatorsearchinsights"], "dur": 66, "voice": ""}, {"id": "7499168956188478742", "user": "bpco_copd_epoc_", "at": "2025-04-30T18:05:38+00:00", "desc": "Interview – Urgence BPCO une tragédie sanitaire ignorée depuis  3 siècles et demi. Cette interview a été réalisée en 2019, au tout début de la crise sanitaire provoquée par la COVID-19. À cette époque, 6 millions de personnes en France vivaient avec une bronchopneumopathie chronique obstructive (BPCO), sans compter les innombrables cas non diagnostiqués. Ces patients, qu’ils soient au stade précoce ou avancé, sont confrontés à une insuffisance respiratoire chronique qui les place en danger de mort permanent, et cela même en dehors d’un contexte pandémique. Face à un virus aussi agressif que le SARS-CoV-2, capable de mettre en péril la vie d’un individu sain, leur extrême vulnérabilité aurait dû mobiliser tout le système de santé globale. En 2025, six ans plus tard, la situation s’est considérablement aggravée, 8 millions de patients sont désormais recensés en France, un chiffre qui frôle les 9 millions, toujours sans inclure les cas non diagnostiqués. À l’échelle mondiale, la BPCO touche aujourd’hui 480 millions de personnes, et provoque chaque année 3,25 millions de décès. Ces morts surviennent dans des souffrances physiques et psychologiques extrêmes, dans des conditions indignes et catastrophiques, marquées par des douleurs et des souffrances atroces et horribles. Pire encore, ces patients meurent dans l’indifférence générale, dans l’anonymat le plus total, comme s’ils n’avaient jamais existé. Pourtant, cette lourde pathologie n’est pas nouvelle. Elle a été décrite pour la première fois en 1679 par le médecin genevois Théophile Bonet. Et depuis plus de trois siècles et demi, aucun progrès thérapeutique majeur n’a vu le jour. Cette inaction inacceptable n’est pas un hasard, elle est la conséquence directe de l’inaction volontaire du corps médical et du secteur de la pneumologie, seuls responsables de ce désastre sanitaire mondial. Malgré son énorme ampleur, la BPCO est toujours marginalisée, sous-estimée, et exclue des priorités de recherche, bien qu’elle soit aujourd’hui la troisième cause de mortalité dans le monde. Cette interview a été réalisée avec Monsieur Philippe Poncet, ancien sportif de haut niveau, lui-même atteint de BPCO, et aujourd’hui directeur de l’association France-BPCO et O2&Cie Urgence BPCO.  Avec son équipe, il mène un combat quotidien, inédit et vital pour obtenir une reconnaissance institutionnelle de cette maladie, accélérer les très rares recherches cliniques existantes, et garantir une prise en charge globale, incluant la reconnaissance des comorbidités sévères qui y sont systématiquement associées. Son engagement est clair, mettre fin à l’invisibilisation de cette maladie, redonner une voix à des millions de malades oubliés, et exiger des réformes médicales urgentes et concrètes. Il ne s’agit plus d’attendre, il s’agit de sauver des millions de vies. SOS : Aidez-nous à combattre la BPCO. 480 millions de patients dans le monde attendent qu’on les voie, qu’on les entende, et surtout, qu’on agisse le plus rapidement possible. #medicina #medicine #medical #copd #bpco #epoc #disease #asthma #asthme #asthmatic #vrs #hmpv #grippe #lungcancer #lungs #f #respiracion #emphysema #pneumonia #lung #tuberculosis #fyp #pulmonaryhypertension #syp  #stitch #explore #pourtoiiiii #foryoupage❤️❤️ #pourtoichallenge ", "views": 9654, "likes": 2124, "comments": 22, "shares": 1318, "tags": ["stitch", "f", "medicine", "explore", "asthma", "lung", "medical", "disease", "fyp", "lungs", "asthmatic", "syp", "tuberculosis", "pneumonia", "medicina", "lungcancer", "vrs", "respiracion", "grippe", "epoc", "copd", "emphysema", "pulmonaryhypertension", "asthme", "pourtoiiiii", "pourtoichallenge", "foryoupage❤️❤️", "hmpv", "bpco"], "dur": 140, "voice": "les malades atteints de bpco grands oubliés en période de Covid la Bronco pneumopathie chronique obstructive est 1 maladie pulmonaire grave qui obstruit les branches la conséquence pour les patients des stades les plus avancés le fait de vivre avec 1 respirateur si cette maladie touche le système respiratoire les malades ne sont pourtant pas le public prioritaire en cette période de crise sanitaire on oublie que 1 pandémie euh respiratoire ça touche avant tout le poumon les dégâts se font sur le poumon et ensuite par rebond bien sûr sur des organes qui peuvent être défaillants que ce soit le cœur ou les reins mais la priorité c'est le poumon et les bpco sont écartés de toute façon de l'espace sanitaire depuis au -30 ou 40 ans et qui plus est quand on est face à 1 pandémie virale aiguë euh auquel on doit euh on doit faire face tirer euh physiquement c'est derrière c'est 1 catastrophe en effet alors que la haute autorité de santé souligne l'importance dans suivi renforcé pour ces personnes atteintes de bpco la réalité du terrain et tout autre pour les vaccins par exemple les malades ne peuvent pas être vaccinés de façon prioritaire 1 autre problématique c'est le diagnostic de cette maladie en France 4.000.000 de personnes seraient atteintes de cette pathologie mais seulement 1.000.000 est diagnostiqué pour Philippe poncé président de la fédération nationale des patients bpco ce problème de diagnostic pourrait même expliquer les chiffres de mortalité imputés à la Covid 19 aujourd'hui il faut pas , fournissant de l'énergie solaire tout en réduisant l'impact environnemental; 3. M. Cheikhou KANE: Invention portant sur un Procédé de traitement des phosphates d'alumine pour produire des engrais granulés (NPK), de l'alumine pure et des rejets utilisables dans le BTP. Le traitement du minerai à chaud permet de récupérer l'alumine et le phosphate par séparation chimique, avec un rendement élevé et compétitif; 4. M.Oumar Fall HAIDARA: Invention portant sur un Moteur à réactions couplant forces fondamentales (magnétiques, gravitationnelles) pour générer une propulsion. Il utilise des dispositifs oscillants et des interactions de champs de force pour produire du mouvement, avec des applications pour les engins spatiaux et la production d'énergie; 5. M. Adama KANE: Invention portant sur un système de paiement numérique sécurisé dédié à la santé (JokkoSanté): les dépenses de santé (achats, dons, assurances) sont traçables de bout en bout. JokkoSanté réduit les coûts annexes et la fraude: les bénéficiaires capturent ainsi plus de 95% des fonds levés. (01) Médaille d'argent : 1. M. Adama FAYE: Invention portant sur un Appareil automatique pour mesurer la vitesse de sédimentation sanguine, destiné aux hôpitaux. Il améliore les méthodes manuelles et automatiques existantes, offrant des résultats plus précis pour le diagnostic de pathologies inflammatoires, infections et autres troubles médicaux. Quatre (04) Médailles de bronze (dans le désordre): 1. Thiouroupe SENE: Invention portant sur une batteuse qui facilite le battage et le vannage de l'arachide, réduisant la pénibilité, le temps de travail et les risques. Elle remplace une douzaine de travailleurs, permettant de traiter un volume plus important en moins de temps, tout en diminuant la main-d'œuvre et en assurant la sécurité; 2. Mouhamed SY: Invention portant sur le Développement d'un système de vaccination intelligent pour poussins, conçu pour effectuer une nébulisation efficace sur les caisses de poussins d'un jour. faisons référence,on les voit tous, bien présents,mais dramatiquement muets face aux cris de détresse de M. Philippe Poncet,qui représente tout les malades BPCO. 🔴Ces responsables,sourds aux réalités de terrain,refusent de reconnaître l’ampleur du désastre sanitaire. Pendant ce temps,les patients atteints de BPCO souffrent en silence,écrasés par une triple peine, Une pathologie pulmonaire incurable et dégénérative à ce jour, Des comorbidités très multiples, Des maladies sous-jacentes extrêmement lourdes,qui aggravent leur condition de manière exponentielle. 🔴La BPCO seule est déjà une lourde pathologie d’une extrême gravité. Lorsqu’elle provoque d'autres comorbidités,d'autres maladies sous-jacentes,comme l’insuffisance cardiaque,des défaillances vasculaires conduisant à des arrêts cardio-respiratoires,des arrêts cardiaques,des pathologies auto-immunes,beaucoup d'autres pathologies très grave que nous avons citées auparavant,dans d'autres vidéos,elle devient un énorme fardeau clinique insupportable,une véritable condamnation à mort. 🔴L’association France BPCO,sous l’impulsion infatigable de M. Philippe Poncet,est aujourd’hui le seul rempart face à une crise sanitaire d’ampleur mondiale. La réalité est implacable: 🔴La BPCO est actuellement la troisième cause de mortalité au monde–et s’apprête à devenir la deuxième,tant le nombre de patients progresse à un rythme effréné. 480millions de personnes vivent actuellement avec une BPCO diagnostiquée. 🔴Ce chiffre,déjà extrêmement très préoccupant,reflète uniquement les cas officiellement identifiés, confirmés par les autorités médicales au monde. Il s'agit de données cliniquement établies,issues d’un diagnostic médical formel. Mais la réalité est bien plus vaste,très inquiétante. Ce nombre ne prend pas en compte les millions d’individus également atteints de la maladie,mais qui n’ont pas encore été diagnostiqués. Cette sous-détection s’explique par deux éléments majeurs: premièrement,les premiers stades de la BPCO se manifestent souvent sans symptômes clairs,ce qui retarde la prise de conscience,la recherche de soins, deuxièmement,les dispositifs de dépistage sont insuffisants:la spirométrie n’est pas pratiquée de manière systématique,les campagnes de sensibilisation sont quasi absentes,les outils de détection précoce sont très limités. Ces malades\"invisibles\"sont pourtant bien porteurs de la pathologie. Et lorsque leur état de santé sera finalement identifié,cette Maladie sera a des stades avancées,leur nombre viendra mécaniquement s’ajouter aux 480millions de cas déjà connus,le véritable impact mondial de la BPCO est donc bien plus lourd que les chiffres officiels ne le laissent entendre,ce fardeau ne cessera de croître tant que le dépistage précoce,la sensibilisation resteront faibles. 🔴Chaque année,plus de 3,25 millions de décès sont attribués à cette lourde pathologie. Des morts souvent atroces,dans l’isolement,les souffrances, l'anonymat,l'handicap,la suffocation,l’agonie. 🔴C’est une véritable hécatombe silencieuse,un génocide médical ignoré. 350 Ans d’Inertie,de Mépris Malgré l’urgence sanitaire,la gravité avérée,aucun traitement curatif n’a été mis au point depuis 350ans. #medicina #medicine #medical #copd #bpco #epoc #disease #asthma #asthme #asma #asthmatic #hmpv #vrs #grippe #lungcancer #f #lungs #respiracion #pneumonia #lung #tuberculosis #fyp #pourtoiiiii #foryoupage❤️❤️ #pourtoichallenge ", "views": 11552, "likes": 5836, "comments": 50, "shares": 1756, "tags": ["f", "medicine", "asthma", "lung", "medical", "disease", "fyp", "lungs", "asthmatic", "asma", "tuberculosis", "pneumonia", "medicina", "lungcancer", "vrs", "respiracion", "grippe", "epoc", "copd", "asthme", "pourtoiiiii", "pourtoichallenge", "foryoupage❤️❤️", "hmpv", "bpco"], "dur": 186, "voice": "je vais très vite je remercie tous les parlementaires vu qu'ils vont bien j'ai entendu beaucoup de yakaha faucon forain je vais vous poser 1 question ce soir il y aura une centaine de morts de BPCO  comme chaque jour il cles et demi, ont ignoré cette pathologie. Qui ont abandonné les malades, étouffé les alertes, et bâillonné la vérité. 🚨🆘️La vidéo supprimée rappelait simplement des faits que beaucoup refusent d'entendre : La BPCO est la 3e cause de mortalité mondiale, bientôt la 2e. Elle tue 3,25 millions de personnes chaque année (sans parler des millions et des millions qu'elle a exterminer depuis ces 3 siècles et ces dernières années passées). Elle touche actuellement 480 millions de personnes, sans compter les non diagnostiqués. Les malades vivent dans la douleur, l’invisibilité et l’indifférence. 🚨🆘️Et pendant ce temps, les responsables nient, censurent, invisibilisent. Ils refusent tout discours qui bouscule leur narration aseptisée. 🚨🆘️Il n’y a toujours aucun traitement curatif. Aucune recherche d’envergure. Aucune volonté politique. Juste des promesses creuses, des décennies de mépris et d’inaction. 🚨🆘️Ce n’est pas un oubli. C’est une stratégie. Un silence volontaire. Un abandon collectif. 🚨🆘️Des millions de malades sont morts dans l’anonymat total. Sans traitement. Sans reconnaissance. Sans mobilisation. 🚨🆘️Cette catastrophe est le fruit d’une chaîne de décisions, d’un système complice, d’un silence criminel. Et aujourd’hui encore, les mêmes discours, les mêmes échecs, les mêmes protocoles inefficaces perdurent. 🚨🆘️Ils ne veulent pas de solution. Reconnaître l’ampleur de la BPCO, c’est reconnaître leur échec historique. 🚨🆘️Censurer, c’est protéger ce système. Censurer, c’est condamner à mort des millions d’êtres humains. 🚨🆘️Nous ne nous tairons pas. Nous continuerons à informer, dénoncer, briser le silence. #creatorsearchinsights #medicina #medical #medicine #copd #bpco #epoc #dpoc #kol #disease #asthma #asthme #asthmatic #respiratory #breatheeasy #vrs #hmpv #grippe #bronchite #toux #lungcancer #husten #gesundheit #bronchitis #lungs #f #respiracion #respirar #pulmones #asma #pneumonia #lung #covid_19 #tuberculosis #sante #maladie #maladieinvisible #fyp #pourtoiiiii #foryo const nf = new Intl.NumberFormat("fr-FR");
const df = new Intl.DateTimeFormat("fr-FR", {
  day: "numeric", month: "short", year: "numeric",
  hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris"
});
const monthFmt = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric", timeZone: "Europe/Paris" });

const qEl = document.getElementById("q");
const monthEl = document.getElementById("month");
const sortEl = document.getElementById("sort");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const whoEl = document.getElementById("who");
const metaEl = document.getElementById("meta");
const player = document.getElementById("player");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

const months = [...new Set(DATA.map((v) => v.at.slice(0, 7)))].sort();
monthEl.innerHTML = '<option value="">Tous les mois</option>' + months.map((m) => {
  const n = DATA.filter((v) => v.at.slice(0, 7) === m).length;
  const label = monthFmt.format(new Date(m + "-15T12:00:00Z"));
  return `<option value="${m}">${label} (${n})</option>`;
}).join("");

let current = 0;
let shown = [];

function when(iso) {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? iso : df.format(d);
}

function urlOf(v) {
  return "https://www.tiktok.com/@" + encodeURIComponent(v.user) + "/video/" + v.id;
}

function visible() {
  const q = qEl.value.trim().toLowerCase();
  const month = monthEl.value;
  const rows = DATA.filter((v) => {
    if (month && !v.at.startsWith(month)) return false;
    if (!q) return true;
    const blob = (v.user + "\n" + v.desc + "\n" + v.tags.join(" ") + "\n" + v.voice).toLowerCase();
    return blob.includes(q);
  });
  const key = sortEl.value;
  rows.sort((a, b) => {
    if (key === "views") return b.views - a.views || a.at.localeCompare(b.at);
    if (key === "likes") return b.likes - a.likes || a.at.localeCompare(b.at);
    return a.at.localeCompare(b.at);
  });
  return rows;
}

function renderList() {
  shown = visible();
  countEl.textContent = shown.length + " / " + DATA.length;
  const html = shown.map((v, i) => `
    <button type="button" class="row${i === current ? " active" : ""}" data-i="${i}">
      <div class="row-top">
        <span class="row-user">@${escapeHtml(v.user)}</span>
        <span>${nf.format(v.views)} vues</span>
      </div>
      <div class="row-top"><span>${when(v.at)}</span></div>
      <p class="row-desc">${escapeHtml(v.desc || "(sans description)")}</p>
    </button>`).join("");
  listEl.innerHTML = html;
  const active = listEl.querySelector(".row.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function show(index, scroll) {
  if (!shown.length) {
    current = 0;
    whoEl.textContent = "Aucun résultat";
    metaEl.innerHTML = "";
    player.removeAttribute("src");
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  current = Math.max(0, Math.min(shown.length - 1, index));
  const v = shown[current];
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === shown.length - 1;
  whoEl.innerHTML = "@" + escapeHtml(v.user) + " <span>" + when(v.at) + " · " + (current + 1) + " / " + shown.length + "</span>";
  const tags = v.tags.length ? `<p class="tags">${v.tags.map((t) => "#" + escapeHtml(t)).join(" ")}</p>` : "";
  const voice = v.voice
    ? `<details><summary>Transcription fournie par TikTok</summary><p class="voice">${escapeHtml(v.voice)}</p></details>`
    : "";
  const dur = v.dur ? ` · ${v.dur} s` : "";
  metaEl.innerHTML = `
    <h2>@${escapeHtml(v.user)}</h2>
    <p class="stats">
      <span>${nf.format(v.views)} vues</span>
      <span>${nf.format(v.likes)} likes</span>
      <span>${nf.format(v.comments)} commentaires</span>
      <span>${nf.format(v.shares)} partages</span>
      <span>${dur.replace(" · ", "")}</span>
    </p>
    <p class="desc">${escapeHtml(v.desc || "")}</p>
    ${tags}
    <p><a href="${urlOf(v)}" target="_blank" rel="noopener">Ouvrir sur TikTok</a></p>
    ${voice}
    <p class="hint">Le lecteur charge la vidéo publique chez TikTok. Une vidéo retirée, privée ou restreinte reste visible ici par son texte, et le lien peut ne plus s’ouvrir.</p>`;
  const src = "https://www.tiktok.com/embed/v2/" + v.id;
  if (player.getAttribute("src") !== src) player.src = src;
  history.replaceState(null, "", "#" + v.id);
  listEl.querySelectorAll(".row").forEach((el) => {
    el.classList.toggle("active", Number(el.dataset.i) === current);
  });
  if (scroll) {
    const active = listEl.querySelector(".row.active");
    if (active) active.scrollIntoView({ block: "nearest" });
  }
}

function refresh(keepId) {
  const id = keepId || (shown[current] && shown[current].id);
  renderList();
  let index = shown.findIndex((v) => v.id === id);
  if (index < 0) index = 0;
  show(index, true);
}

listEl.addEventListener("click", (event) => {
  const row = event.target.closest(".row");
  if (!row) return;
  show(Number(row.dataset.i), false);
});
prevBtn.addEventListener("click", () => show(current - 1, true));
nextBtn.addEventListener("click", () => show(current + 1, true));
qEl.addEventListener("input", () => refresh());
monthEl.addEventListener("change", () => refresh());
sortEl.addEventListener("change", () => refresh());
document.addEventListener("keydown", (event) => {
  if (event.target === qEl) return;
  if (event.key === "ArrowLeft") show(current - 1, true);
  if (event.key === "ArrowRight") show(current + 1, true);
});

const startId = location.hash.replace("#", "");
renderList();
const start = shown.findIndex((v) => v.id === startId);
show(start >= 0 ? start : 0, true);
</script>
</body>
