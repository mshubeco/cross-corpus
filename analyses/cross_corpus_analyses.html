    function plotDonut(el, block, title) {
      if (!el || !block?.slices?.length) return;
      const labels = block.slices.map((s) => s.hub ? `@${s.hub}` : s.label);
      const values = block.slices.map((s) => s.value);
      const colors = block.slices.map((s) => s.color);
      Plotly.newPlot(el, [{
        type: "pie", hole: 0.55, labels, values,
        marker: { colors },
        textinfo: "percent",
        hovertemplate: "%{label}<br>%{value:,} (%{percent})<extra></extra>",
      }], {
        title: { text: title, font: { size: 12, color: "#9aa3b5" } },
        paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "#e8eaed", size: 11 },
        margin: { t: 36, b: 10, l: 10, r: 10 },
        showlegend: true,
        legend: { orientation: "h", y: -0.08, font: { size: 10 } },
        height: 300,
      }, { responsive: true, displayModeBar: false });
    }

    function plotActivity(el, daily) {
      if (!el || !daily?.series?.length) return;
      const traces = daily.series.map((s) => ({
        x: daily.dates,
        y: s.counts,
        name: s.hub ? `@${s.hub}` : s.label,
        type: "scatter", mode: "lines",
        line: { color: s.color, width: s.communityId === -1 ? 1 : 2 },
        stackgroup: "one",
      }));
      Plotly.newPlot(el, traces, {
        paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "#e8eaed", size: 11 },
        margin: { t: 10, b: 40, l: 48, r: 12 },
        xaxis: { gridcolor: "#2a3142" },
        yaxis: { gridcolor: "#2a3142", title: "publications" },
        legend: { orientation: "h", y: 1.12 },
        height: 340,
      }, { responsive: true, displayModeBar: false });
    }

    function plotEngagement(el, ph) {

      const byId = (ph.inStrengthByType || {}).byId || {};
      const top5 = ((ph.inStrengthByType || {}).top5 || []).map(String);
      const types = (ph.inStrengthByType || {}).types || ["rt", "reply", "quote", "mention"];
      const colors = { rt: "#4d8af0", reply: "#e08a3a", quote: "#de81ff", mention: "#00bd94" };
      const hubs = Object.fromEntries((ph.nodes || []).map((n) => [String(n.communityId), n.hub]));
      const y = top5.map((id) => hubs[id] ? `@${hubs[id]}` : `C${id}`);
      const traces = types.map((t) => ({
        type: "bar", orientation: "h", name: t,
        y, x: top5.map((id) => (byId[id] || {})[t] || 0),
        marker: { color: colors[t] || "#9aa3b5" },
      }));
      Plotly.newPlot(el, traces, {
        barmode: "stack",
        paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",

    function plotSankey(el, sankey) {
      if (!el || !sankey?.nodes?.length) return;
      const nodes = sankey.nodes;
      const idx = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
      const links = (sankey.links || []).filter((l) => idx[l.from] != null && idx[l.to] != null);
      Plotly.newPlot(el, [{
        type: "sankey",
        arrangement: "snap",
        node: {
          label: nodes.map((n) => `@${n.hub || n.id}`),
          color: nodes.map((n) => n.color),
          pad: 14, thickness: 14,

        link: {
          source: links.map((l) => idx[l.from]),
          target: links.map((l) => idx[l.to]),
          value: links.map((l) => l.weight),

    function flowsHtml(ph) {
      const edges = (ph.edges || []).slice(0, 25);
      if (!edges.length) return `<p class="hint">Aucun flux intercommunautaire.</p>`;
      return edges.map((e) => {
        const posts = (e.topPosts || []).slice(0, 3).map((p) =>
          `<div class="post-text"><span class="flow-meta">@${esc(p.author)} → @${esc(p.target)} · ${esc(p.date)} · ${esc(p.type)}</span><br>${esc(p.text)}</div>`
        ).join("");
        return `<details class="flow-item">
          <summary>
            <span class="dot" style="background:${esc(e.sourceColor)}"></span>
            <span class="flow-title">@${esc(e.sourceHub)} → @${esc(e.targetHub)}</span>
            <span class="flow-meta">${fmt(e.total)} · RT ${fmt(e.rt)} (${esc(e.rtPct)}%)</span>
          </summary>
          <div class="flow-posts">${posts || "<p class='hint'>Pas d'exemples non-RT.</p>"}</div>
        </details>`;
      }).join("");
    }

        return `<div class="comm-acct">

      const pid = corp.id;
      const ph = DATA[pid];
      if (!ph) return `<p class="subtitle">Données indisponibles pour ${esc(pid)}.</p>`;
      const meta = ph.structureMeta || {};
      const conn = (meta.connectome || {}).path || `outputs/connectome/data/${pid}/graph.json`;
      return `
        <p class="subtitle">${esc(ph.phaseLabel)}</p>
        <div class="kpi-row">
          <div class="kpi"><div class="v">${fmt(meta.n_tweets)}</div><div class="l">Tweets</div></div>
          <div class="kpi"><div class="v">${fmt(meta.n_users)}</div><div class="l">Utilisateurs</div></div>
          <div class="kpi"><div class="v">${fmt(meta.n_edges)}</div><div class="l">Interactions</div></div>
          <div class="kpi"><div class="v">${meta.modularity != null ? String(meta.modularity).replace(".", ",") : "—"}</div><div class="l">Modularité</div></div>
          <div class="kpi"><div class="v">${fmt(meta.n_main_communities)}</div><div class="l">Comm. principales</div></div>
          <div class="kpi"><div class="v">${fmt((meta.connectome||{}).n_nodes)}</div><div class="l">Nœuds connectome</div></div>
        </div>
        <p class="hint">Louvain unique · seed 42 · top ${(ph.top6Order||[]).length} pôles ·
          <a class="link" href="../connectome/index.html">ouvrir le connectome interactif</a>
          (données <code>${esc(conn)}</code>)</p>
        <div class="viz-box">
          <div class="viz-title">Volume quotidien · corpus entier</div>
          <div id="volume-${pid}" class="volume-full-chart"></div>
        </div>
        <div class="viz-box">
          <div class="viz-title">Utilisateurs par communauté (top)</div>
          <div id="users-${pid}" class="activity-chart" style="min-height:280px"></div>
        </div>
        <h2>Vue globale par communauté</h2>
        <p class="hint">Parts du réseau Louvain · top affiché + Autres</p>
        <div class="donut-grid">
          <div class="viz-box"><div id="donut-in-${pid}"></div></div>
          <div class="viz-box"><div id="donut-out-${pid}"></div></div>
          <div class="viz-box"><div id="donut-rt-${pid}"></div></div>
        </div>
        <div class="viz-box">
          <div class="viz-title">Activité temporelle par communauté</div>
          <div id="activity-${pid}" class="activity-chart"></div>
        </div>
        <div class="heatmap-duo">
          <div class="viz-box">
            <div class="viz-title">Interactions reçues · empilées (top 5)</div>
            <div id="eng-${pid}" class="activity-chart"></div>
          </div>
          <div class="viz-box">
            <div class="viz-title">Likes plateforme · top 5</div>
            <div id="likes-${pid}" class="activity-chart"></div>
          </div>
        </div>
        <div class="viz-box">
          <div class="viz-title">Concentration des récepteurs (top 5 / 20 / 50)</div>
          <p class="hint">Part de l'in-strength captée par les comptes les plus centraux de chaque pôle</p>
          <div id="conc-${pid}" class="activity-chart"></div>
        </div>
        <div class="main-grid">
          <div class="viz-box">
            <div class="viz-title">Sankey inter / intra (top pôles)</div>
            <p class="hint">Total ${fmt((ph.sankey||{}).total)} · interne ${(ph.sankey||{}).internalPct ?? "—"}%</p>
            <div id="sankey-${pid}" style="min-height:420px"></div>
          </div>
          <div class="side-box">
            <div class="viz-title">Flux intercommunautaires</div>
            <p class="hint">${esc(ph.hubMethodNote || "")}</p>
            <div id="flows-${pid}">${flowsHtml(ph)}</div>
          </div>
        </div>
        <div class="side-box accounts-box">
          <div class="viz-title">Comptes top par communauté (in-strength)</div>
          ${rankingsHtml(ph)}
        </div>`;
    }

    function activate(id) {
      [...tabs.querySelectorAll(".tab")].forEach((t) => t.classList.toggle("active", t.dataset.id === id));
      [...panels.querySelectorAll(".panel")].forEach((p) => p.classList.toggle("active", p.dataset.id === id));
      const ph = DATA[id];
      if (!ph || ph._plotted) return;
      ph._plotted = true;
      plotVolume(document.getElementById(`volume-${id}`), ph.volumeDaily);
      const users = ph.usersByCommunity || [];
      Plotly.newPlot(document.getElementById(`users-${id}`), [{
        type: "bar",
        x: users.map((u) => u.hub ? `@${u.hub}` : `C${u.communityId}`),
        y: users.map((u) => u.nUsers),
        marker: { color: users.map((u) => u.color) },
      }], {
        paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "#e8eaed", size: 11 },
        margin: { t: 10, b: 60, l: 48, r: 12 },
        yaxis: { gridcolor: "#2a3142", title: "utilisateurs" },
        xaxis: { tickangle: -20 },
        height: 280,
      }, { responsive: true, displayModeBar: false });
      const gd = ph.globalDistributions || {};
      plotDonut(document.getElementById(`donut-in-${id}`), gd.inStrength, "In-strength");
      plotDonut(document.getElementById(`donut-out-${id}`), gd.outStrength, "Out-strength");
      plotDonut(document.getElementById(`donut-rt-${id}`), gd.rtReceived, "RT reçus");
      plotActivity(document.getElementById(`activity-${id}`), ph.dailyActivity);
      plotEngagement(document.getElementById(`eng-${id}`), ph);
      plotLikes(document.getElementById(`likes-${id}`), ph);
      plotConcentration(document.getElementById(`conc-${id}`), ph);
      plotSankey(document.getElementById(`sankey-${id}`), ph.sankey);
    }

    corpora.forEach((c, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (i === 0 ? " active" : "");
      b.dataset.id = c.id;
      b.textContent = c.label;
      b.addEventListener("click", () => activate(c.id));
      tabs.appendChild(b);

      const p = document.createElement("div");
      p.className = "panel" + (i === 0 ? " active" : "");
      p.dataset.id = c.id;
      p.innerHTML = panelHtml(c);
      panels.appendChild(p);
    });

    if (corpora[0]) activate(corpora[0].id);
  </script>
</body>
</html>
