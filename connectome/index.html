  <script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const wrap = document.getElementById('c');
const labelsEl = document.getElementById('labels');
const loading = document.getElementById('loading');

const P = {
  linkLight: 0.28,
  bloom: 0.38,
  radius: 0.08,
  threshold: 0.22,
  opacity: 0.07,
  strands: 4,
  segments: 18,
  nLabels: 40,
  exposure: 0.72,
};

const tip = document.getElementById('tooltip');
const tabsEl = document.getElementById('tabs');
const intercommLinkEl = document.getElementById('intercommLink');
const intercommLinkHintEl = document.getElementById('intercommLinkHint');
let currentCorpusId = null;
let corporaList = [];
const graphCache = new Map();
const pubStatsCache = new Map();

function maxOf(arr, pick, fallback = 1) {
  let m = fallback;
  for (let i = 0; i < arr.length; i++) {
    const v = pick(arr[i]);
    if (v > m) m = v;
  }
  return m;
}
function minOf(arr, pick, fallback = 0) {
  if (!arr.length) return fallback;
  let m = pick(arr[0]);
  for (let i = 1; i < arr.length; i++) {
    const v = pick(arr[i]);
    if (v < m) m = v;
  }
  return m;
}

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false,
  preserveDrawingBuffer: true,
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = P.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const aspect = innerWidth / innerHeight;
const frustum = 480;
const camera = new THREE.OrthographicCamera(
  -frustum * aspect, frustum * aspect, frustum, -frustum, -2000, 2000
);
camera.position.set(0, 0, 400);

const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.enableRotate = false;
controls.screenSpacePanning = true;
controls.minZoom = 0.008;
controls.maxZoom = 20;
controls.target.set(0, 0, 0);

/** Margin around bbox on load (higher = more dezoom). */
const FIT_PADDING = 1.45;

function quantileSorted(arr, p) {
  return arr[Math.max(0, Math.min(arr.length - 1, Math.floor(p * (arr.length - 1))))];
}

/** Robust core bbox — ignore outliers and fallback nodes placed far outside Gephi. */
function coreBounds(nodes, lo = 0.05, hi = 0.95) {
  const xs = nodes.map((n) => n.x).sort((a, b) => a - b);
  const ys = nodes.map((n) => n.y).sort((a, b) => a - b);
  return {
    minX: quantileSorted(xs, lo),
    maxX: quantileSorted(xs, hi),
    minY: quantileSorted(ys, lo),
    maxY: quantileSorted(ys, hi),
  };
}

function inCoreBounds(n, b, pad = 0.06) {
  const mx = (b.maxX - b.minX) * pad;
  const my = (b.maxY - b.minY) * pad;
  return (
    n.x >= b.minX - mx && n.x <= b.maxX + mx
    && n.y >= b.minY - my && n.y <= b.maxY + my
  );
}

function fitGraphToView(nodes) {
  if (!nodes?.length) return;
  const b = coreBounds(nodes, 0.05, 0.95);
  const cx = (b.minX + b.maxX) * 0.5;
  const cy = (b.minY + b.maxY) * 0.5;
  const halfW = Math.max((b.maxX - b.minX) * 0.5, 1) * FIT_PADDING;
  const halfH = Math.max((b.maxY - b.minY) * 0.5, 1) * FIT_PADDING;
  const a = innerWidth / innerHeight;
  const zoom = Math.min((frustum * a) / halfW, frustum / halfH);
  camera.position.set(cx, cy, 400);
  controls.target.set(cx, cy, 0);
  camera.zoom = Math.max(controls.minZoom, Math.min(controls.maxZoom, zoom));
  camera.updateProjectionMatrix();
  controls.update();
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  P.bloom, P.radius, P.threshold
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

let lineMat = null;
let lineGeo = null;
let lineColorsBase = null;
let graphData = null;
let labelItems = [];

function lift(rgb, mul = 1.15) {
  // keep colors vivid but not neon-blown / white-core
  return [
    Math.min(1.05, (rgb[0] / 255) * mul),
    Math.min(1.05, (rgb[1] / 255) * mul),
    Math.min(1.05, (rgb[2] / 255) * mul),
  ];
}

function rgbCss(rgb, alpha = 1) {
  if (!rgb || rgb.length < 3) return alpha < 1 ? `rgba(200,200,200,${alpha})` : '#c8c8c8';
  const r = Math.round(rgb[0]), g = Math.round(rgb[1]), b = Math.round(rgb[2]);
  return alpha < 1 ? `rgba(${r},${g},${b},${alpha})` : `rgb(${r},${g},${b})`;
}

function normalizeHandle(raw) {
  return String(raw || '').trim().replace(/^@+/, '').toLowerCase();
}

function displayHandle(raw) {
  const h = String(raw || '').trim();
  if (!h) return '';
  return h.startsWith('@') ? h : `@${h}`;
}

function xProfileUrl(raw) {
  const h = normalizeHandle(raw);
  return h ? `https://x.com/${encodeURIComponent(h)}` : null;
}

function intercommPageUrl(corpusId) {
  if (!corpusId) return null;
  return new URL(`../analyses/intercomm/${corpusId}.html`, import.meta.url).href;
}

function syncCorpusUrl(corpusId) {
  if (!corpusId) return;
  const url = new URL(location.href);
  if (url.searchParams.get('corpus') === corpusId) return;
  url.searchParams.set('corpus', corpusId);
  history.replaceState({ corpus: corpusId }, '', url);
}

function resolveCorpus(corpusParam) {
  const id = String(corpusParam || '').trim().toLowerCase();
  if (!id) return null;
  return corporaList.find((c) => c.id === id) || null;
}

function syncCorpusSubTabs(corp) {
  const id = corp?.id || currentCorpusId;
  if (intercommLinkEl) {
    const iu = intercommPageUrl(id);
    if (iu) intercommLinkEl.href = iu;
  }
  if (intercommLinkHintEl) {
    intercommLinkHintEl.textContent = corp?.label ? `· ${corp.label}` : 'analyses Louvain';
  }
}

function openXProfile(raw) {
  const url = xProfileUrl(raw);
  if (url) window.open(url, '_blank', 'noopener,noreferrer');
}

function navigateFromNode(node) {
  if (!node?.l) return;
  openXProfile(node.l);
}

function worldFromClient(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ndcY = -(((clientY - rect.top) / rect.height) * 2 - 1);
  return {
    x: ndcX * (camera.right - camera.left) * 0.5 / camera.zoom + controls.target.x,
    y: ndcY * (camera.top - camera.bottom) * 0.5 / camera.zoom + controls.target.y,
  };
}

function hitTestNode(clientX, clientY) {
  if (!graphData?.nodes?.length) return null;
  const { x: worldX, y: worldY } = worldFromClient(clientX, clientY);
  const hitR = 14 / camera.zoom;
  let best = null;
  let bestD = hitR * hitR;
  for (const n of graphData.nodes) {
    const dx = n.x - worldX;
    const dy = n.y - worldY;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD) {
      bestD = d2;
      best = n;
    }
  }
  return best;
}

/** Communautés cumulées jusqu'à ~90 % des nœuds (meta pipeline ou fallback client). */
function communitiesCovering90(data, target = 0.9) {
  if (data?.meta?.communities90?.length) {
    return {
      rows: data.meta.communities90,
      coverage: data.meta.communities90CoveragePct
        ?? data.meta.communities90.reduce((s, c) => s + (c.pct || 0), 0),
    };
  }
  const nodes = data?.nodes || [];
  const total = nodes.length || 1;
  const byCom = new Map();
  for (const n of nodes) {
    const cid = n.com ?? -1;
    if (!byCom.has(cid)) byCom.set(cid, []);
    byCom.get(cid).push(n);
  }
  const ranked = [...byCom.entries()]
    .map(([id, arr]) => {
      arr.sort((a, b) => (b.deg || 0) - (a.deg || 0));
      const rgb = arr[0]?.c || [154, 163, 181];
      return {
        id,
        color: rgbCss(rgb),
        n: arr.length,
        pct: Math.round((1000 * arr.length) / total) / 10,
        accounts: arr.slice(0, 8).map((n) => ({ l: n.l, deg: Math.round((n.deg || 0) * 10) / 10 })),
      };
    })
    .sort((a, b) => b.n - a.n);
  const rows = [];
  let cum = 0;
  for (const row of ranked) {
    rows.push(row);
    cum += row.n;
    if (cum / total >= target) break;
  }
  return { rows, coverage: Math.round((1000 * cum) / total) / 10 };
}

function renderCommPanel(data) {
  const list = document.getElementById('commList');
  const sub = document.getElementById('commSub');
  if (!list || !sub) return;
  const { rows, coverage } = communitiesCovering90(data);
  const stats = data?.meta?.pubStats;
  const byPub = new Map((stats?.communities || []).map((c) => [Number(c.id), c]));
  const scrollHint = rows.length > 5 ? ' · défiler pour les suivantes' : '';
  const pubHint = stats ? ' · part = volume de publication' : '';
  sub.textContent = `${rows.length} communauté${rows.length > 1 ? 's' : ''} · ${coverage.toLocaleString('fr-FR')} % des nœuds · comptes par degré pondéré${pubHint}${scrollHint}`;
  list.innerHTML = '';
  for (const row of rows) {
    const el = document.createElement('div');
    el.className = 'comm-row';
    const handles = (row.accounts || [])
      .slice(0, 6)
      .map((a) => {
        const raw = String(a.l || '').replace(/^@/, '');
        if (!raw) return '';
        const h = `@${raw}`;
        const href = xProfileUrl(raw);
        return `<a class="handle" href="${href}" target="_blank" rel="noopener noreferrer" title="Ouvrir sur X">${h}</a>`;
      })
      .filter(Boolean)
      .join(', ');
    const pub = byPub.get(Number(row.id)) || (row.pubPct != null ? row : null);
    const pubPct = pub?.pubPct;
    const pubBit = pubPct != null
      ? ` · <span class="pub">${Number(pubPct).toLocaleString('fr-FR')} % pubs</span>`
      : '';
    const bar = pubPct != null
      ? `<div class="comm-pubbar" title="Part du volume de publication du corpus"><i style="width:${Math.max(1, Math.min(100, pubPct))}%"></i></div>`
      : '';
    el.innerHTML = `
      <div class="comm-swatch" style="background:${row.color}"></div>
      <div>
        <div class="comm-head"><span>C${row.id}</span><span class="comm-metrics">${row.pct}% nœuds${pubBit}</span></div>
        <div class="comm-accounts">${handles || '—'}</div>
        ${bar}
      </div>`;
    list.appendChild(el);
  }
}

function lerp3(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function hash(i) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/** Quadratic bezier samples for one hair strand. */
function strandPoints(ax, ay, bx, by, segs, seed) {
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy) || 1;
  const bulge = Math.min(42, len * (0.05 + 0.12 * hash(seed)));
  const sign = hash(seed + 3) > 0.5 ? 1 : -1;
  const px = -dy / len, py = dx / len;
  // lateral offset between strands (hair separation)
  const off = (hash(seed + 7) - 0.5) * Math.min(10, len * 0.05);
  const cx = (ax + bx) * 0.5 + px * bulge * sign + px * off;
  const cy = (ay + by) * 0.5 + py * bulge * sign + py * off;
  // tiny endpoint jitter so strands don't share the exact same tip
  const j = Math.min(3.5, len * 0.012);
  const ax2 = ax + px * (hash(seed + 11) - 0.5) * j;
  const ay2 = ay + py * (hash(seed + 13) - 0.5) * j;
  const bx2 = bx + px * (hash(seed + 17) - 0.5) * j;
  const by2 = by + py * (hash(seed + 19) - 0.5) * j;

  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const u = 1 - t;
    pts.push(
      u * u * ax2 + 2 * u * t * cx + t * t * bx2,
      u * u * ay2 + 2 * u * t * cy + t * t * by2,
      0
    );
  }
  return pts;
}

/** Luminosité des liens : 0 = aucune lumière / liens invisibles, 1 = intensité max. */
function applyLinkLight(level = P.linkLight) {
  P.linkLight = Math.max(0, Math.min(1, level));
  const slider = document.getElementById('linkLight');
  if (slider && slider.value !== String(P.linkLight)) slider.value = String(P.linkLight);
  if (!lineGeo || !lineColorsBase || !lineMat) return;
  const col = lineGeo.attributes.color.array;
  const k = P.linkLight;
  for (let i = 0; i < lineColorsBase.length; i++) col[i] = lineColorsBase[i] * k;
  lineGeo.attributes.color.needsUpdate = true;
  lineMat.opacity = k * P.opacity;
  lineMat.visible = k > 0.0005;
}

function buildGraph(data) {
  graphData = data;
  while (scene.children.length) scene.remove(scene.children[0]);

  const nodes = data.nodes;
  const edges = data.edges;
  const maxW = maxOf(edges, (e) => e.w || 0, 1);

  // Auto-tune hair density for large graphs (GPU/RAM + call-stack)
  if (edges.length > 200_000) {
    P.strands = 1;
    P.segments = 6;
  } else if (edges.length > 80_000) {
    P.strands = 2;
    P.segments = 8;
  } else if (edges.length > 30_000) {
    P.strands = 3;
    P.segments = 12;
  }

  const positions = [];
  const colors = [];
  let seed = 1;
  const core = coreBounds(nodes, 0.05, 0.95);

  for (const e of edges) {
    const a = nodes[e.s];
    const b = nodes[e.t];
    if (!a || !b) continue;
    // Skip long spokes to out-of-GEXF fallback nodes (they clip the viewport).
    if (!inCoreBounds(a, core) || !inCoreBounds(b, core)) continue;

    const ca = lift(a.c, 1.18);
    const cb = lift(b.c, 1.18);
    const wNorm = Math.pow(e.w / maxW, 0.45);
    // faint individual hair — density creates brightness
    const bright = 0.28 + 0.55 * wNorm;

    for (let s = 0; s < P.strands; s++) {
      // outer strands slightly dimmer
      const strandBright = bright * (1 - s * 0.12);
      const pts = strandPoints(a.x, a.y, b.x, b.y, P.segments, seed++);
      const n = pts.length / 3;
      for (let i = 0; i < n - 1; i++) {
        const t0 = i / (n - 1);
        const t1 = (i + 1) / (n - 1);
        const c0 = lerp3(ca, cb, t0);
        const c1 = lerp3(ca, cb, t1);
        positions.push(
          pts[i * 3], pts[i * 3 + 1], pts[i * 3 + 2],
          pts[(i + 1) * 3], pts[(i + 1) * 3 + 1], pts[(i + 1) * 3 + 2]
        );
        colors.push(
          c0[0] * strandBright, c0[1] * strandBright, c0[2] * strandBright,
          c1[0] * strandBright, c1[1] * strandBright, c1[2] * strandBright
        );
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  lineGeo = geo;
  lineColorsBase = new Float32Array(colors);

  lineMat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
  });

  const lines = new THREE.LineSegments(geo, lineMat);
  lines.frustumCulled = false;
  scene.add(lines);
  applyLinkLight(P.linkLight);

  // microscopic hubs only (almost invisible — edges carry the look)
  const n = nodes.length;
  const nPos = new Float32Array(n * 3);
  const nCol = new Float32Array(n * 3);
  const nSize = new Float32Array(n);
  const maxDeg = maxOf(nodes, (x) => x.deg || 1, 1);
  for (let i = 0; i < n; i++) {
    const nd = nodes[i];
    nPos[i * 3] = nd.x;
    nPos[i * 3 + 1] = nd.y;
    nPos[i * 3 + 2] = 0.15;
    const c = lift(nd.c, 1.1);
    nCol[i * 3] = c[0];
    nCol[i * 3 + 1] = c[1];
    nCol[i * 3 + 2] = c[2];
    nSize[i] = 0.4 + 2.2 * Math.sqrt((nd.deg || 1) / maxDeg);
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(nCol, 3));
  pGeo.setAttribute('size', new THREE.BufferAttribute(nSize, 1));
  const pMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uPR: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float size; attribute vec3 color;
      varying vec3 vC;
      uniform float uPR;
      void main() {
        vC = color;
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = size * uPR;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vC;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.4, 0.0, d) * 0.35;
        gl_FragColor = vec4(vC, a);
        if (a < 0.01) discard;
      }`,
  });
  const pts = new THREE.Points(pGeo, pMat);
  pts.frustumCulled = false;
  scene.add(pts);

  document.getElementById('stats').textContent =
    `${data.meta.n_nodes.toLocaleString('fr-FR')} nœuds · ${data.meta.n_edges.toLocaleString('fr-FR')} liens · ${P.strands}× hair`;
  fitGraphToView(nodes);
  renderCommPanel(data);
  rebuildLabels();
}

function rebuildLabels() {
  labelsEl.innerHTML = '';
  labelItems = [];
  if (!graphData) return;

  // Gephi Preview "Proportional size" → label size tracks viz:size (field `s`)
  const scored = graphData.nodes.map((n, i) => ({
    ...n,
    i,
    gephiSize: Math.max(n.s || 1, 1),
  }));

  const byCom = new Map();
  for (const n of scored) {
    const c = n.com ?? -1;
    if (!byCom.has(c)) byCom.set(c, []);
    byCom.get(c).push(n);
  }

  const comOrder = [...byCom.entries()]
    .map(([com, arr]) => ({
      com,
      arr: arr.sort((a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg)),
      mass: arr.reduce((s, n) => s + n.gephiSize * Math.log1p(n.deg || 1), 0),
      size: arr.length,
    }))
    .sort((a, b) => b.mass - a.mass);

  const budget = P.nLabels;
  const picked = new Map();
  const mainComs = comOrder.filter((c) => c.size >= 40).slice(0, 28);

  for (const c of mainComs) {
    if (c.arr[0]) picked.set(c.arr[0].i, c.arr[0]);
  }

  const totalMass = mainComs.reduce((s, c) => s + c.mass, 0) || 1;
  for (const c of mainComs) {
    const quota = Math.min(4, Math.max(1, Math.round(1 + (c.mass / totalMass) * 10)));
    for (let k = 0; k < quota && k < c.arr.length; k++) {
      if (picked.size >= budget) break;
      picked.set(c.arr[k].i, c.arr[k]);
    }
    if (picked.size >= budget) break;
  }

  if (picked.size < budget) {
    for (const n of [...scored].sort((a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg))) {
      if (picked.size >= budget) break;
      picked.set(n.i, n);
    }
  }

  const ranked = [...picked.values()].sort(
    (a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg)
  );
  if (!ranked.length) return;

  // Strong Gephi-like contrast: font ∝ viz:size^1.35 (range ~8px → ~52px)
  const sMin = minOf(ranked, (n) => n.gephiSize, 1);
  const sMax = maxOf(ranked, (n) => n.gephiSize, 1);
  const sSpan = Math.max(sMax - sMin, 1e-6);

  const ordered = [...ranked].sort((a, b) => a.gephiSize - b.gephiSize);

  for (const node of ordered) {
    const el = document.createElement('div');
    el.className = 'label';
    // Match Gephi labels (@handle)
    const text = node.l.startsWith('@') ? node.l : `@${node.l}`;
    el.textContent = text;

    // Normalize then power-curve amplify tops (like Gephi ranking spline feel)
    const u = (node.gephiSize - sMin) / sSpan; // 0‥1
    const t = Math.pow(u, 0.7); // keep mid visible, stretch top
    // Also bake absolute size so s=6 >> s=2 even within set
    const abs = Math.pow(node.gephiSize / sMax, 1.25);
    const mix = 0.45 * t + 0.55 * abs;
    const fontPx = Math.round(7 + 32 * mix); // ~7 → 39 (un peu plus petit)

    el.style.fontSize = `${fontPx}px`;
    el.style.fontWeight = mix > 0.7 ? '700' : mix > 0.4 ? '600' : '500';
    el.style.zIndex = String(Math.round(10 + 90 * mix));
    el.style.opacity = '0.94';
    const labelColor = rgbCss(node.c);
    el.style.color = labelColor;
    el.style.textShadow = '0 0 6px rgba(0,0,0,0.85), 0 1px 2px rgba(0,0,0,0.75)';
    el.title = `${text} — clic : profil X`;
    el.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      navigateFromNode(node);
    });
    labelsEl.appendChild(el);

    labelItems.push({
      el,
      text,
      x: node.x,
      y: node.y,
      pr: node.pr,
      deg: node.deg || 0,
      gephiSize: node.gephiSize,
      fontPx,
      t: mix,
      boxW: Math.max(28, text.length * fontPx * 0.55 + 12),
      boxH: fontPx * 1.35,
      com: node.com,
      color: labelColor,
      rgb: node.c,
      visible: false,
      ox: 0,
      oy: 0,
    });
  }

  // Refine box sizes from real DOM metrics (better anti-overlap)
  requestAnimationFrame(() => {
    for (const it of labelItems) {
      const r = it.el.getBoundingClientRect();
      if (r.width > 0) {
        it.boxW = r.width + 6;
        it.boxH = r.height + 4;
      }
    }
  });
}

function labelScreenBox(cx, cy, boxW, boxH, ox, oy) {
  // CSS: left/top = node, then translate(-50%, -130%)
  // label top-left ≈ (cx - boxW/2 + ox, cy - 1.3*boxH + oy)
  const left = cx - boxW * 0.5 + ox;
  const top = cy - boxH * 1.3 + oy;
  return { left, top, right: left + boxW, bottom: top + boxH, w: boxW, h: boxH };
}

function boxesHit(a, b, pad = 6) {
  return !(
    a.right + pad <= b.left ||
    a.left - pad >= b.right ||
    a.bottom + pad <= b.top ||
    a.top - pad >= b.bottom
  );
}

function projectLabels() {
  const w = innerWidth;
  const h = innerHeight;
  const z = camera.zoom || 1;

  const bySize = [...labelItems].sort(
    (a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg)
  );

  const maxShow = labelItems.length;
  const revealN = Math.max(
    4,
    Math.min(maxShow, Math.ceil(maxShow * Math.min(1, Math.max(0.3, (z - 0.3) / 2.2))))
  );
  const candidates = bySize.slice(0, revealN);

  const placed = [];

  for (const it of labelItems) {
    it.visible = false;
    it.el.style.display = 'none';
  }

  const offsets = (bw, bh) => [
    [0, 0],
    [0, -bh * 0.4],
    [0, bh * 0.5],
    [bw * 0.4, 0],
    [-bw * 0.4, 0],
    [bw * 0.3, -bh * 0.35],
    [-bw * 0.3, -bh * 0.35],
    [bw * 0.3, bh * 0.4],
    [-bw * 0.3, bh * 0.4],
  ];

  const showAt = (it, cx, cy, ox, oy, box) => {
    it.visible = true;
    it.ox = ox;
    it.oy = oy;
    it.sx = cx + ox;
    it.sy = cy + oy;
    it.el.style.display = 'block';
    it.el.style.left = `${it.sx}px`;
    it.el.style.top = `${it.sy}px`;
    placed.push({ box, it });
  };

  for (const it of candidates) {
    const v = new THREE.Vector3(it.x, it.y, 0).project(camera);
    if (v.z > 1) continue;
    const cx = (v.x * 0.5 + 0.5) * w;
    const cy = (-v.y * 0.5 + 0.5) * h;
    if (cx < -80 || cx > w + 80 || cy < -80 || cy > h + 80) continue;

    let placedOk = false;
    for (const [ox, oy] of offsets(it.boxW, it.boxH)) {
      const box = labelScreenBox(cx, cy, it.boxW, it.boxH, ox, oy);
      if (box.left < 2 || box.right > w - 2 || box.top < 2 || box.bottom > h - 2) continue;
      if (placed.some((p) => boxesHit(box, p.box, 8))) continue;

      showAt(it, cx, cy, ox, oy, box);
      placedOk = true;
      break;
    }
    if (!placedOk) {
      it.visible = false;
      it.el.style.display = 'none';
    }
  }
}

function onResize() {
  const a = innerWidth / innerHeight;
  camera.left = -frustum * a;
  camera.right = frustum * a;
  camera.top = frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.resolution.set(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

document.getElementById('linkLight').oninput = (e) => { applyLinkLight(+e.target.value); };
document.getElementById('bloom').oninput = (e) => { bloomPass.strength = +e.target.value; P.bloom = +e.target.value; };
document.getElementById('op').oninput = (e) => { P.opacity = +e.target.value; applyLinkLight(P.linkLight); };
document.getElementById('nLabels').oninput = (e) => { P.nLabels = +e.target.value; rebuildLabels(); };

const exportBtn = document.getElementById('exportBtn');
const exportStatus = document.getElementById('exportStatus');
let exporting = false;

function parseExportSize(val) {
  if (val === 'screen') {
    const pr = Math.min(devicePixelRatio, 2);
    return {
      w: Math.round(innerWidth * pr * 2),
      h: Math.round(innerHeight * pr * 2),
    };
  }
  const [w, h] = val.split('x').map(Number);
  return { w, h };
}

function maxGpuSize() {
  const gl = renderer.getContext();
  const a = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || 8192;
  const b = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 8192;
  // leave headroom for bloom mip chain
  return Math.min(a, b, 8192);
}

function drawLabelsOnCtx(ctx, w, h, scale) {
  if (!labelItems.length) return;
  const bySize = [...labelItems].sort(
    (a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg)
  );
  const candidates = bySize;
  const placed = [];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';

  const paint = (it, cx, cy, ox, oy, fontPx, text) => {
    const weight = (it.t || 0) > 0.7 ? '700' : (it.t || 0) > 0.4 ? '600' : '500';
    ctx.font = `${weight} ${fontPx}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    ctx.globalAlpha = 0.94;
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = it.color || rgbCss(it.rgb) || '#ffffff';
    ctx.fillText(text, cx + ox, cy + oy - fontPx * 0.25);
    ctx.shadowBlur = 0;
  };

  for (const it of candidates) {
    const v = new THREE.Vector3(it.x, it.y, 0).project(camera);
    if (v.z > 1) continue;
    const cx = (v.x * 0.5 + 0.5) * w;
    const cy = (-v.y * 0.5 + 0.5) * h;
    const fontPx = Math.max(10, Math.round((it.fontPx || 12) * scale));
    const text = it.text || it.el.textContent;
    const boxW = Math.max(28, text.length * fontPx * 0.55 + 12);
    const boxH = fontPx * 1.35;
    const offs = [
      [0, 0], [0, -boxH * 0.4], [0, boxH * 0.5],
      [boxW * 0.4, 0], [-boxW * 0.4, 0],
      [boxW * 0.3, -boxH * 0.35], [-boxW * 0.3, -boxH * 0.35],
    ];

    for (const [ox, oy] of offs) {
      const box = labelScreenBox(cx, cy, boxW, boxH, ox, oy);
      if (box.left < 2 || box.right > w - 2 || box.top < 2 || box.bottom > h - 2) continue;
      if (placed.some((p) => boxesHit(box, p, 8))) continue;
      paint(it, cx, cy, ox, oy, fontPx, text);
      placed.push(box);
      break;
    }
  }
  ctx.globalAlpha = 1;
}

/** Read WebGL default framebuffer → ImageData (Y-flipped for 2D canvas). */
function readGlToImageData(w, h) {
  const gl = renderer.getContext();
  const bw = gl.drawingBufferWidth;
  const bh = gl.drawingBufferHeight;
  if (bw < 1 || bh < 1) throw new Error('drawingBuffer vide');

  const pixels = new Uint8Array(bw * bh * 4);
  // ensure pending GPU cmds flushed into default FB
  renderer.getContext().finish?.();
  gl.readPixels(0, 0, bw, bh, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

  // sanity: count non-black pixels
  let lit = 0;
  for (let i = 0; i < pixels.length; i += 16) {
    if (pixels[i] > 2 || pixels[i + 1] > 2 || pixels[i + 2] > 2) lit++;
  }
  if (lit < 8) {
    throw new Error('framebuffer quasi-noir (bloom/GPU?)');
  }

  const img = new ImageData(bw, bh);
  // flip Y (GL origin = bottom-left)
  const row = bw * 4;
  for (let y = 0; y < bh; y++) {
    const src = (bh - 1 - y) * row;
    img.data.set(pixels.subarray(src, src + row), y * row);
  }
  return { img, bw, bh };
}

function applyExportCamera(prev, w, h) {
  const halfW = ((prev.right - prev.left) * 0.5) / prev.zoom;
  const halfH = ((prev.top - prev.bottom) * 0.5) / prev.zoom;
  const exportAspect = w / h;
  let expHalfW;
  let expHalfH;
  if (halfW / halfH > exportAspect) {
    expHalfW = halfW;
    expHalfH = halfW / exportAspect;
  } else {
    expHalfH = halfH;
    expHalfW = halfH * exportAspect;
  }
  camera.left = -expHalfW;
  camera.right = expHalfW;
  camera.top = expHalfH;
  camera.bottom = -expHalfH;
  camera.zoom = 1;
  camera.updateProjectionMatrix();
}

async function renderExportFrame(w, h, useBloom) {
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.setRenderTarget(null);
  renderer.clear();

  if (useBloom) {
    composer.setSize(w, h);
    bloomPass.resolution.set(w, h);
    // force last pass onto default framebuffer
    composer.renderToScreen = true;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }

  // double rAF so buffer is ready
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return readGlToImageData(w, h);
}

async function exportPng() {
  if (exporting || !graphData) return;
  exporting = true;
  exportBtn.disabled = true;

  const { w: wantW, h: wantH } = parseExportSize(document.getElementById('exportSize').value);
  const maxS = maxGpuSize();
  let w = wantW;
  let h = wantH;
  // soft cap: bloom needs ~2–4× memory; stay safer on big graphs
  const softCap = graphData.edges.length > 50_000 ? 4096 : 6144;
  const cap = Math.min(maxS, softCap);
  if (Math.max(w, h) > cap) {
    const s = cap / Math.max(w, h);
    w = Math.max(1, Math.floor(w * s));
    h = Math.max(1, Math.floor(h * s));
    exportStatus.textContent = `Plafond ${cap}px → ${w}×${h}…`;
  } else {
    exportStatus.textContent = `Rendu ${w}×${h}…`;
  }

  const prev = {
    pr: renderer.getPixelRatio(),
    cssW: innerWidth,
    cssH: innerHeight,
    left: camera.left,
    right: camera.right,
    top: camera.top,
    bottom: camera.bottom,
    zoom: camera.zoom,
  };

  try {
    await new Promise((r) => requestAnimationFrame(r));
    controls.update();
    applyExportCamera(prev, w, h);

    let frame;
    try {
      exportStatus.textContent = `Rendu bloom ${w}×${h}…`;
      frame = await renderExportFrame(w, h, true);
    } catch (e1) {
      console.warn('export bloom failed, fallback sans bloom', e1);
      exportStatus.textContent = `Fallback sans bloom ${w}×${h}…`;
      // shrink further if needed
      if (Math.max(w, h) > 4096) {
        const s = 4096 / Math.max(w, h);
        w = Math.floor(w * s);
        h = Math.floor(h * s);
        applyExportCamera(prev, w, h);
      }
      frame = await renderExportFrame(w, h, false);
    }

    const { img, bw, bh } = frame;
    const out = document.createElement('canvas');
    out.width = bw;
    out.height = bh;
    const ctx = out.getContext('2d');
    ctx.putImageData(img, 0, 0);

    const labelScale = Math.max(bw, bh) / 1400;
    drawLabelsOnCtx(ctx, bw, bh, labelScale);

    exportStatus.textContent = `Encodage PNG ${bw}×${bh}…`;
    await new Promise((r) => requestAnimationFrame(r));

    const blob = await new Promise((resolve, reject) => {
      out.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png');
    });

    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = `connectome_${bw}x${bh}_${stamp}.png`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    const mb = (blob.size / (1024 * 1024)).toFixed(1);
    exportStatus.textContent = `OK · ${name} · ${mb} Mo`;
  } catch (err) {
    console.error(err);
    exportStatus.textContent = `Erreur: ${err.message || err}`;
  } finally {
    camera.left = prev.left;
    camera.right = prev.right;
    camera.top = prev.top;
    camera.bottom = prev.bottom;
    camera.zoom = prev.zoom;
    camera.updateProjectionMatrix();
    renderer.setRenderTarget(null);
    renderer.setPixelRatio(prev.pr);
    renderer.setSize(prev.cssW, prev.cssH, true);
    composer.setSize(prev.cssW, prev.cssH);
    bloomPass.resolution.set(prev.cssW, prev.cssH);
    composer.renderToScreen = true;
    exporting = false;
    exportBtn.disabled = false;
  }
}

exportBtn.addEventListener('click', () => { exportPng(); });

(function loop() {
  requestAnimationFrame(loop);
  if (exporting) return;
  controls.update();
  composer.render();
  projectLabels();
})();

async function loadCorpus(corp) {
  currentCorpusId = corp.id;
  syncCorpusUrl(corp.id);
  loading.classList.remove('hidden');
  loading.textContent = `Chargement · ${corp.label}…`;
  [...tabsEl.querySelectorAll('.tab')].forEach((b) => {
    b.classList.toggle('active', b.dataset.id === corp.id);
  });
  syncCorpusSubTabs(corp);
  try {
    let data = graphCache.get(corp.id);
    if (!data) {
      const url = new URL(corp.connectomeData || `./data/${corp.id}/graph.json`, import.meta.url);
      url.searchParams.set("t", String(Date.now()));
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      data = await r.json();
      graphCache.set(corp.id, data);
    }
    try {
      let pubs = pubStatsCache.get(corp.id);
      if (!pubs) {
        const pu = new URL(`./data/${corp.id}/community_stats.json`, import.meta.url);
        pu.searchParams.set("t", String(Date.now()));
        const pr = await fetch(pu);
        if (pr.ok) {
          pubs = await pr.json();
          pubStatsCache.set(corp.id, pubs);
        }
      }
      if (pubs) {
        data.meta = data.meta || {};
        data.meta.pubStats = pubs;
      }
    } catch (_) { /* optional */ }
    // reset hair density defaults before auto-tune in buildGraph
    P.strands = 4;
    P.segments = 18;
    buildGraph(data);
    document.title = `Connectome — ${corp.label}`;
    loading.classList.add('hidden');
  } catch (err) {
    loading.textContent = String(err);
  }
}

function setupTooltip() {
  let ptrDown = null;
  let hoverNode = null;

  renderer.domElement.style.cursor = 'grab';

  renderer.domElement.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    ptrDown = { x: ev.clientX, y: ev.clientY };
    renderer.domElement.style.cursor = 'grabbing';
  });

  const endPtr = () => {
    ptrDown = null;
    renderer.domElement.style.cursor = hoverNode ? 'pointer' : 'grab';
  };
  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (!ptrDown || ev.button !== 0) {
      endPtr();
      return;
    }
    const dx = ev.clientX - ptrDown.x;
    const dy = ev.clientY - ptrDown.y;
    const moved = (dx * dx + dy * dy) > 36;
    ptrDown = null;
    renderer.domElement.style.cursor = hoverNode ? 'pointer' : 'grab';
    if (moved) return;
    const node = hitTestNode(ev.clientX, ev.clientY);
    if (!node) return;
    navigateFromNode(node);
  });
  renderer.domElement.addEventListener('pointercancel', endPtr);

  renderer.domElement.addEventListener('mousemove', (ev) => {
    if (!graphData) return;
    const best = hitTestNode(ev.clientX, ev.clientY);
    hoverNode = best;
    if (!ptrDown) renderer.domElement.style.cursor = best ? 'pointer' : 'grab';
    if (!best) {
      tip.style.display = 'none';
      return;
    }
    const handle = displayHandle(best.l);
    tip.innerHTML =
      `<strong>${handle}</strong>` +
      `<div class="muted">comm. C${best.com} · deg ${Math.round(best.deg || 0)} · PR ${(best.pr || 0).toExponential(2)}</div>` +
      `<div class="hint">Clic → profil X</div>`;
    tip.style.display = 'block';
    tip.style.left = `${Math.min(ev.clientX + 14, innerWidth - 300)}px`;
    tip.style.top = `${Math.min(ev.clientY + 14, innerHeight - 100)}px`;
  });
  renderer.domElement.addEventListener('mouseleave', () => {
    tip.style.display = 'none';
    hoverNode = null;
    if (!ptrDown) renderer.domElement.style.cursor = 'grab';
  });
}

async function boot() {
  setupTooltip();
  let corpora = [
    { id: 'ebola', label: 'Ebola', connectomeData: './data/ebola/graph.json' },
    { id: 'hantavirus', label: 'Hantavirus', connectomeData: './data/hantavirus/graph.json' },
    { id: 'mpox', label: 'Mpox', connectomeData: './data/mpox/graph.json' },
    { id: 'macron_nucleaire', label: 'Macron nucléaire', connectomeData: './data/macron_nucleaire/graph.json' },
  ];
  try {
    const m = await fetch(new URL('./manifest.json', import.meta.url)).then((r) => r.json());
    if (m.corpora?.length) corpora = m.corpora;
    if (m.defaults?.linkLight != null) {
      P.linkLight = m.defaults.linkLight;
      document.getElementById('linkLight').value = String(P.linkLight);
    }
    if (m.defaults?.opacity != null) {
      P.opacity = m.defaults.opacity;
      document.getElementById('op').value = String(P.opacity);
    }
    applyLinkLight(P.linkLight);
    if (m.defaults?.bloom != null) {
      P.bloom = m.defaults.bloom;
      document.getElementById('bloom').value = String(P.bloom);
      bloomPass.strength = P.bloom;
    }
    if (m.defaults?.labels != null) {
      P.nLabels = m.defaults.labels;
      document.getElementById('nLabels').value = String(P.nLabels);
    }
  } catch (_) { /* fallback list */ }

  corporaList = corpora;
  tabsEl.innerHTML = '';
  for (const corp of corpora) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.dataset.id = corp.id;
    b.textContent = corp.label;
    b.addEventListener('click', () => loadCorpus(corp));
    tabsEl.appendChild(b);
  }
  // Deep-link: ?corpus=ebola
  const start = resolveCorpus(new URLSearchParams(location.search).get('corpus')) || corpora[0];
  await loadCorpus(start);
}

window.addEventListener('popstate', () => {
  if (!corporaList.length) return;
  const corp = resolveCorpus(new URLSearchParams(location.search).get('corpus')) || corporaList[0];
  if (corp.id !== currentCorpusId) loadCorpus(corp);
});

boot();
  </script>
