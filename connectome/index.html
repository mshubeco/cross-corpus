  <script>
  (function () {
    var p = new URLSearchParams(location.search);
    var id = (p.get('corpus') || 'ebola').toLowerCase();
    var g = p.get('graph');
    var file = g === 'rt' ? 'graph_rt.json' : 'graph.json';
    if (g === 'rt_classes') {
      preload('./data/' + encodeURIComponent(id) + '/graph_rt.json');
    }
    function preload(href) {
      var l = document.createElement('link');
      l.rel = 'preload';
      l.as = 'fetch';
      l.href = href;
      l.crossOrigin = 'anonymous';
      document.head.appendChild(l);
    }
    preload('./data/' + encodeURIComponent(id) + '/' + file);
    preload('./data/' + encodeURIComponent(id) + '/community_stats.json');

function rtEdgeClass(rtFrac) {
  const t = Math.max(0, Math.min(1, rtFrac || 0));
  if (t <= RT_CLASS_IX_MAX) return 'ix';
  if (t >= RT_CLASS_RT_MIN) return 'rt';
  return 'mix';
}

function rtClassStyle(cls) {
  if (cls === 'ix') return { col: COL_INTERACT, lumMul: 2.2 };
  if (cls === 'rt') return { col: COL_RETWEET, lumMul: 0.12 };
  return { col: COL_MIXED, lumMul: 0.6 };
}

/** Aligne graph_rt.json → indices du graphe ALL via screen_name. */
function buildRtWeightMap(allData, rtData) {
  const nameTo = new Map();
  (allData.nodes || []).forEach((n, i) => {
    const l = String(n.l || n.id || '').toLowerCase();
    if (l) nameTo.set(l, i);
  });
  const map = new Map();
  const rtNodes = rtData.nodes || [];
  for (const e of rtData.edges || []) {
    const a = rtNodes[e.s];
    const b = rtNodes[e.t];
    if (!a || !b) continue;
    const ia = nameTo.get(String(a.l || a.id || '').toLowerCase());
    const ib = nameTo.get(String(b.l || b.id || '').toLowerCase());
    if (ia == null || ib == null) continue;
    const k = `${ia}|${ib}`;
    map.set(k, (map.get(k) || 0) + (Number(e.w) || 0));
  }
  return map;
}

function edgeRtFrac(e, rtMap) {
  if (!rtMap || !e) return 0;
  let wr = rtMap.get(`${e.s}|${e.t}`);
  if (wr == null) wr = rtMap.get(`${e.t}|${e.s}`) || 0;
  const w = Number(e.w) || 0;
  if (w <= 0) return 0;
  return Math.min(1, wr / w);
}

function idle(ms = 0) {
  return new Promise((resolve) => {
    if (ms > 0) {
      setTimeout(resolve, ms);
      return;
    }
    if (typeof requestIdleCallback === 'function') {
      requestIdleCallback(() => resolve(), { timeout: 1200 });
    } else {
      setTimeout(resolve, 0);
    }
  });
}

async function fetchJsonWithProgress(url, onProgress) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const total = Number(r.headers.get('content-length')) || 0;
  if (!r.body || !total || !r.body.getReader) {
    onProgress?.(null);
    return r.json();
  }
  const reader = r.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.byteLength;
    onProgress?.(received / total, received, total);
  }
  const buf = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) {
    buf.set(c, off);
    off += c.byteLength;
  }
  onProgress?.(1, received, total);
  return JSON.parse(new TextDecoder().decode(buf));
}

function graphUrlFor(corp, mode) {
  if (mode === 'rt') return new URL(`./data/${corp.id}/graph_rt.json`, import.meta.url);
  // all + rt_classes partagent le graphe toutes-interactions
  return new URL(corp.connectomeData || `./data/${corp.id}/graph.json`, import.meta.url);
}

function cacheKeyFor(corpusId, mode) {
  const m = mode === 'rt_classes' ? 'all' : mode;
  return `${corpusId}:${m}`;
}

async function ensureGraphData(corp, mode, { onProgress, force = false } = {}) {
  const key = cacheKeyFor(corp.id, mode);
  if (!force && graphCache.has(key)) return graphCache.get(key);
  if (inflightFetches.has(key)) return inflightFetches.get(key);
  const url = graphUrlFor(corp, mode);
  const p = fetchJsonWithProgress(url, onProgress)
    .then((data) => {
      graphCache.set(key, data);
      inflightFetches.delete(key);
      return data;
    })
    .catch((err) => {
      inflightFetches.delete(key);
      throw err;
    });
  inflightFetches.set(key, p);
  return p;
}

async function ensurePubStats(corpusId) {
  if (pubStatsCache.has(corpusId)) return pubStatsCache.get(corpusId);
  const key = `pubs:${corpusId}`;
  if (inflightFetches.has(key)) return inflightFetches.get(key);
  const url = new URL(`./data/${corpusId}/community_stats.json`, import.meta.url);
  const p = fetch(url)
    .then(async (r) => {
      if (!r.ok) return null;
      const pubs = await r.json();
      pubStatsCache.set(corpusId, pubs);
      return pubs;
    })
    .catch(() => null)
    .finally(() => inflightFetches.delete(key));
  inflightFetches.set(key, p);
  return p;
}

function prefetchAnalysesAssets(corpusId) {
  if (!corpusId) return;

    `../analyses/intercomm/${corpusId}.json`,

}

async function warmBackgroundCaches(preferId) {
  if (warmStarted || !corporaList.length) return;
  warmStarted = true;
  const ordered = [...corporaList].sort((a, b) => {
    if (a.id === preferId) return -1;
    if (b.id === preferId) return 1;
    // Small corpora first so switches feel instant sooner.
    const rank = { ebola: 0, ebola_2_2026: 1, mpox: 2, hantavirus: 3, macron_nucleaire: 4 };
    return (rank[a.id] ?? 9) - (rank[b.id] ?? 9);
  });
  for (const corp of ordered) {
    for (const mode of ['all', 'rt']) {
      const key = cacheKeyFor(corp.id, mode);
      if (graphCache.has(key) || inflightFetches.has(key)) continue;
      await idle(40);
      markTabPrefetch(corp.id, true);
      try {
        await ensureGraphData(corp, mode);
      } catch (_) { /* keep warm silent */ }
      markTabPrefetch(corp.id, false);
    }
    if (!pubStatsCache.has(corp.id)) {
      await idle(20);
      await ensurePubStats(corp.id);
    }
    if (corp.id === preferId || corp.id === currentCorpusId) {
      prefetchAnalysesAssets(corp.id);
    }
  }
}

function maxOf(arr, pick, fallback = 1) {
  let m = fallback;
  for (let i = 0; i < arr.length; i++) {
    const v = pick(arr[i]);
    if (v > m) m = v;
  }
  return m;
}
function minOf(arr, pick, fallback = 0) {
  if (!arr.length) return fallback;
  let m = pick(arr[0]);
  for (let i = 1; i < arr.length; i++) {
    const v = pick(arr[i]);
    if (v < m) m = v;
  }
  return m;
}

/** Margin around bbox on load (higher = more dezoom). */
const FIT_PADDING = 1.45;
/** Zoom at last fit — overview label budget is relative to this. */
let fitZoom = 1;

function quantileSorted(arr, p) {
  return arr[Math.max(0, Math.min(arr.length - 1, Math.floor(p * (arr.length - 1))))];
}

/** Robust core bbox — ignore outliers and fallback nodes placed far outside Gephi. */
function coreBounds(nodes, lo = 0.05, hi = 0.95) {
  const xs = nodes.map((n) => n.x).sort((a, b) => a - b);
  const ys = nodes.map((n) => n.y).sort((a, b) => a - b);
  return {
    minX: quantileSorted(xs, lo),
    maxX: quantileSorted(xs, hi),
    minY: quantileSorted(ys, lo),
    maxY: quantileSorted(ys, hi),
  };
}

function inCoreBounds(n, b, pad = 0.06) {
  const mx = (b.maxX - b.minX) * pad;
  const my = (b.maxY - b.minY) * pad;
  return (
    n.x >= b.minX - mx && n.x <= b.maxX + mx
    && n.y >= b.minY - my && n.y <= b.maxY + my
  );
}

function fitGraphToView(nodes) {
  if (!nodes?.length) return;
  const b = coreBounds(nodes, 0.05, 0.95);
  const cx = (b.minX + b.maxX) * 0.5;
  const cy = (b.minY + b.maxY) * 0.5;
  const halfW = Math.max((b.maxX - b.minX) * 0.5, 1) * FIT_PADDING;
  const halfH = Math.max((b.maxY - b.minY) * 0.5, 1) * FIT_PADDING;
  const a = innerWidth / innerHeight;
  const zoom = Math.min((frustum * a) / halfW, frustum / halfH);
  camera.position.set(cx, cy, 400);
  controls.target.set(cx, cy, 0);
  camera.zoom = Math.max(controls.minZoom, Math.min(controls.maxZoom, zoom));
  camera.updateProjectionMatrix();
  controls.update();
  fitZoom = camera.zoom;
  lastLabelCamKey = '';
}

function setHashtagFilter(tag) {
  activeHashtag = tag ? String(tag).toLowerCase() : null;
  if (!activeHashtag) {
    applyNodeHighlight(null);
  } else {
    const accounts = accountsForHashtag(activeHashtag);
    let comms = communitiesForHashtag(activeHashtag);
    // Si pas de mapping communauté, déduire depuis les comptes matchés
    if (!comms.size && accounts.size && graphData?.nodes) {
      comms = new Set();
      for (const nd of graphData.nodes) {
        const sn = String(nd.l || '').toLowerCase().replace(/^@/, '');
        if (accounts.has(sn) && nd.com != null) comms.add(Number(nd.com));
      }
    }
    applyNodeHighlight({ accounts, comms, tag: activeHashtag });
  }
  if (viewMode !== 'analyses') setViewMode('analyses');
  if (graphData) renderCommPanel(graphData);
  if (selectedCommId != null) openEspaceFiche(selectedCommId);
}

function applyNodeHighlight(filter) {
  if (!pointsMesh || !nodeColorsBase || !graphData?.nodes) return;
  const col = pointsMesh.geometry.attributes.color.array;
  const base = nodeColorsBase;
  const sizeAttr = pointsMesh.geometry.attributes.size;
  const n = graphData.nodes.length;
  if (!filter) {
    col.set(base);
    pointsMesh.geometry.attributes.color.needsUpdate = true;
    if (sizeAttr && nodeSizesBase) {
      sizeAttr.array.set(nodeSizesBase);
      sizeAttr.needsUpdate = true;
    }
    if (lineMat && lineColorsBase) applyLinkLight(P.linkLight);
    lineColorsDimmed = false;
    return;
  }
  const accounts = filter.accounts || new Set();
  const comms = filter.comms || new Set();
  const onNode = new Uint8Array(n);
  let nOn = 0;
  for (let i = 0; i < n; i++) {
    const nd = graphData.nodes[i];
    const sn = String(nd.l || '').toLowerCase().replace(/^@/, '');
    // Priorité : toute la communauté où le # est distinctif (+ boost comptes connus)
    const inComm = comms.size > 0 && comms.has(Number(nd.com));
    const inAcc = accounts.size > 0 && accounts.has(sn);
    const on = inComm || inAcc;
    if (on) {
      onNode[i] = inAcc ? 2 : 1;
      nOn++;
    }
    const k = onNode[i] === 2 ? 1.85 : onNode[i] === 1 ? 1.35 : 0.045;
    col[i * 3] = base[i * 3] * k;
    col[i * 3 + 1] = base[i * 3 + 1] * k;
    col[i * 3 + 2] = base[i * 3 + 2] * k;
    if (sizeAttr && nodeSizesBase) {
      const sm = onNode[i] === 2 ? 2.4 : onNode[i] === 1 ? 1.55 : 0.28;
      sizeAttr.array[i] = nodeSizesBase[i] * sm;
    }
  }
  pointsMesh.geometry.attributes.color.needsUpdate = true;
  if (sizeAttr) sizeAttr.needsUpdate = true;

  if (lineMat && lineColorsBase && lineGeo) {
    const lc = lineGeo.attributes.color.array;
    const baseL = lineColorsBase;
    const linkK = Math.max(P.linkLight, 0.05);
    const nVert = lc.length / 3;
    if (lineEdgeA && lineEdgeB && lineEdgeA.length === nVert && nOn > 0) {
      for (let v = 0, o = 0; v < nVert; v++, o += 3) {
        const a = lineEdgeA[v];
        const b = lineEdgeB[v];
        const hit = (a >= 0 && onNode[a] > 0) || (b >= 0 && onNode[b] > 0);
        const k = hit ? linkK * 1.2 : linkK * 0.05;
        lc[o] = baseL[o] * k;
        lc[o + 1] = baseL[o + 1] * k;
        lc[o + 2] = baseL[o + 2] * k;
      }
      lineMat.opacity = Math.min(0.55, P.opacity * 2.2);
    } else {
      const dim = 0.12;
      for (let i = 0; i < baseL.length; i++) lc[i] = baseL[i] * linkK * dim;
      lineMat.opacity = linkK * P.opacity * 0.35;
    }
    lineGeo.attributes.color.needsUpdate = true;
    lineColorsDimmed = true;
  }
}

    : '';

    .slice(0, 5)
    .map(
      (s) =>
        `<div class="sample"><div class="meta">@${escapeHtml(s.sn)}${s.at ? ` · ${escapeHtml(s.at)}` : ''}${s.tag ? ` · #${escapeHtml(s.tag)}` : ''}</div><div class="txt">${escapeHtml(s.text)}</div></div>`

    </div>
    <div class="fiche-just">${escapeHtml(d.justification || '')}</div>
    <h4>Hashtags / signaux distinctifs</h4>
    <div class="lexique" id="ficheTags">${tags || '—'}</div>
    <h4>Mots-clés distinctifs</h4>
    <div class="lexique">${words || '—'}</div>
    ${themesHtml}

    <a class="fiche-ext" href="${analysesHref}" target="_blank" rel="noopener noreferrer">Ouvrir les analyses complètes ↗</a>
    <div class="limit">${escapeHtml(limit)}</div>`;
  espaceFicheEl.classList.add('open');
  espaceFicheEl.querySelector('.fiche-close')?.addEventListener('click', () => {
    espaceFicheEl.classList.remove('open');

  espaceFicheEl.querySelectorAll('#ficheTags .tag-chip').forEach((btn) => {

  document.querySelectorAll('#commList .comm-row').forEach((row) => {

async function ensureDiscourse(corpusId) {
  if (discourseCache.has(corpusId)) return discourseCache.get(corpusId);
  try {
    const url = new URL(`./data/${corpusId}/discourse.json`, import.meta.url);
    url.searchParams.set('t', String(Date.now()));
    const r = await fetch(url);
    if (!r.ok) {
      discourseCache.set(corpusId, null);
      return null;
    }
    const disc = await r.json();
    discourseCache.set(corpusId, disc);
    return disc;
  } catch (_) {
    discourseCache.set(corpusId, null);
    return null;
  }
}

/** Overview slider → max candidates kept for zoom-in local labels. */
function labelPoolCap(nLabels, nNodes) {
  if (nLabels <= 0 || nNodes <= 0) return 0;
  return Math.min(nNodes, Math.max(nLabels * 16, 240), 1200);
}

/** How many labels to attempt at this zoom (overview at fit, full pool ~8×). */
function labelRevealCount(zoom, fitZ, overviewN, poolN) {
  if (overviewN <= 0 || poolN <= 0) return 0;
  const rel = (zoom || 0) / Math.max(fitZ, 1e-6);
  if (rel < 1) {
    return Math.max(0, Math.min(poolN, Math.round(overviewN * Math.max(0.4, rel))));
  }
  const t = Math.max(0, Math.min(1, Math.log2(rel) / 3));
  return Math.min(poolN, Math.round(overviewN + (poolN - overviewN) * t));
}

function overlapPadForZoom(zoom, fitZ) {
  const rel = (zoom || 0) / Math.max(fitZ, 1e-6);
  if (rel >= 5) return 3;
  if (rel >= 2.2) return 5;
  return 8;
}

function labelOffsetOptions(bw, bh) {
  return [
    [0, 0],
    [0, -bh * 0.4],
    [0, bh * 0.5],
    [bw * 0.4, 0],
    [-bw * 0.4, 0],
    [bw * 0.3, -bh * 0.35],
    [-bw * 0.3, -bh * 0.35],
    [bw * 0.3, bh * 0.4],
    [-bw * 0.3, bh * 0.4],
  ];
}

/** Petits graphes : points trop fins vs labels Gephi (~7–39px). Harmonise l’échelle. */
function graphVisualScale(nNodes) {
  if (nNodes < 2500) {
    return { nodeBoost: 5.5, pointAlpha: 0.72, labelMinPx: 8, labelMaxPx: 15 };
  }
  if (nNodes < 12000) {
    return { nodeBoost: 2.2, pointAlpha: 0.5, labelMinPx: 7, labelMaxPx: 22 };
  }
  return { nodeBoost: 1.0, pointAlpha: 0.35, labelMinPx: 7, labelMaxPx: 39 };
}

function pickLabelPool(nodes, overviewN) {
  const poolCap = labelPoolCap(overviewN, nodes.length);
  if (poolCap <= 0) return [];

  const scored = nodes.map((n, i) => ({
    node: n,
    i,
    gephiSize: Math.max(n.s || 1, 1),
    deg: n.deg || 0,
    com: n.com ?? -1,
  }));

  const byCom = new Map();
  for (const s of scored) {
    if (!byCom.has(s.com)) byCom.set(s.com, []);
    byCom.get(s.com).push(s);
  }
  const comOrder = [...byCom.values()]
    .map((arr) => {
      arr.sort((a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg));
      return {
        arr,
        mass: arr.reduce((sum, n) => sum + n.gephiSize * Math.log1p(n.deg || 1), 0),
        size: arr.length,
      };
    })
    .sort((a, b) => b.mass - a.mass);

  const picked = new Map();
  const take = (s) => {
    if (picked.size >= poolCap) return false;
    picked.set(s.i, s);
    return picked.size < poolCap;
  };

  const mainComs = comOrder.filter((c) => c.size >= 5).slice(0, 120);
  for (const c of mainComs) {
    if (c.arr[0] && !take(c.arr[0])) break;
  }

  const totalMass = mainComs.reduce((sum, c) => sum + c.mass, 0) || 1;
  for (const c of mainComs) {
    const quota = Math.min(40, Math.max(2, Math.round(2 + (c.mass / totalMass) * poolCap * 0.5)));
    for (let k = 0; k < quota && k < c.arr.length; k++) {
      if (!take(c.arr[k])) break;
    }
    if (picked.size >= poolCap) break;
  }

  if (picked.size < poolCap && nodes.length) {
    const b = coreBounds(nodes, 0.04, 0.96);
    const cols = 16;
    const rows = 16;
    const dx = (b.maxX - b.minX) || 1;
    const dy = (b.maxY - b.minY) || 1;
    const cells = Array.from({ length: cols * rows }, () => []);
    for (const s of scored) {
      const n = s.node;
      if (!inCoreBounds(n, b, 0.1)) continue;
      let cx = Math.floor(((n.x - b.minX) / dx) * cols);
      let cy = Math.floor(((n.y - b.minY) / dy) * rows);
      cx = Math.max(0, Math.min(cols - 1, cx));
      cy = Math.max(0, Math.min(rows - 1, cy));
      cells[cy * cols + cx].push(s);
    }
    for (const cell of cells) {
      cell.sort((a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg));
      const per = cell.length > 80 ? 4 : 2;
      for (let k = 0; k < per && k < cell.length; k++) {
        if (!take(cell[k])) break;
      }
      if (picked.size >= poolCap) break;
    }
  }

  if (picked.size < poolCap) {
    const glob = [...scored].sort((a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg));
    for (const s of glob) {
      if (!take(s)) break;
    }
  }

  return [...picked.values()];
}

function lift(rgb, mul = 1.15) {
  // keep colors vivid but not neon-blown / white-core
  return [
    Math.min(1.05, (rgb[0] / 255) * mul),
    Math.min(1.05, (rgb[1] / 255) * mul),
    Math.min(1.05, (rgb[2] / 255) * mul),
  ];
}

function rgbCss(rgb, alpha = 1) {
  if (!rgb || rgb.length < 3) return alpha < 1 ? `rgba(200,200,200,${alpha})` : '#c8c8c8';
  const r = Math.round(rgb[0]), g = Math.round(rgb[1]), b = Math.round(rgb[2]);
  return alpha < 1 ? `rgba(${r},${g},${b},${alpha})` : `rgb(${r},${g},${b})`;
}

  if (!corpusId) return;
  const url = new URL(location.href);
  const nextGraph = (graphMode === 'rt' || graphMode === 'rt_classes') ? graphMode : null;
  const nextView = viewMode === 'analyses' ? 'analyses' : null;
  const sameCorpus = url.searchParams.get('corpus') === corpusId;
  const sameGraph = (url.searchParams.get('graph') || null) === nextGraph;
  const sameView = (url.searchParams.get('view') || null) === nextView;
  if (sameCorpus && sameGraph && sameView) return;
  url.searchParams.set('corpus', corpusId);
  if (nextGraph) url.searchParams.set('graph', nextGraph);
  else url.searchParams.delete('graph');
  if (nextView) url.searchParams.set('view', nextView);
  else url.searchParams.delete('view');
  history.replaceState({ corpus: corpusId, graph: graphMode, view: viewMode }, '', url);
}

function worldFromClient(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ndcY = -(((clientY - rect.top) / rect.height) * 2 - 1);
  return {
    x: ndcX * (camera.right - camera.left) * 0.5 / camera.zoom + controls.target.x,
    y: ndcY * (camera.top - camera.bottom) * 0.5 / camera.zoom + controls.target.y,
  };
}

function hitTestNode(clientX, clientY) {
  if (!graphData?.nodes?.length) return null;
  const { x: worldX, y: worldY } = worldFromClient(clientX, clientY);
  const hitR = 14 / camera.zoom;
  let best = null;
  let bestD = hitR * hitR;
  for (const n of graphData.nodes) {
    const dx = n.x - worldX;
    const dy = n.y - worldY;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD) {
      bestD = d2;
      best = n;
    }
  }
  return best;
}

/** Communautés cumulées jusqu'à ~90 % des nœuds (meta pipeline ou fallback client). */
function communitiesCovering90(data, target = 0.9) {
  if (data?.meta?.communities90?.length) {
    return {
      rows: data.meta.communities90,
      coverage: data.meta.communities90CoveragePct
        ?? data.meta.communities90.reduce((s, c) => s + (c.pct || 0), 0),
    };
  }
  const nodes = data?.nodes || [];
  const total = nodes.length || 1;
  const byCom = new Map();
  for (const n of nodes) {
    const cid = n.com ?? -1;
    if (!byCom.has(cid)) byCom.set(cid, []);
    byCom.get(cid).push(n);
  }
  const ranked = [...byCom.entries()]
    .map(([id, arr]) => {
      arr.sort((a, b) => (b.deg || 0) - (a.deg || 0));
      const rgb = arr[0]?.c || [154, 163, 181];
      return {
        id,
        color: rgbCss(rgb),
        n: arr.length,
        pct: Math.round((1000 * arr.length) / total) / 10,
        accounts: arr.slice(0, 8).map((n) => ({ l: n.l, deg: Math.round((n.deg || 0) * 10) / 10 })),
      };
    })
    .sort((a, b) => b.n - a.n);
  const rows = [];
  let cum = 0;
  for (const row of ranked) {
    rows.push(row);
    cum += row.n;
    if (cum / total >= target) break;
  }
  return { rows, coverage: Math.round((1000 * cum) / total) / 10 };
}

function lerp3(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function hash(i) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/** Quadratic bezier samples for one hair strand. */
function strandPoints(ax, ay, bx, by, segs, seed) {
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy) || 1;
  const bulge = Math.min(42, len * (0.05 + 0.12 * hash(seed)));
  const sign = hash(seed + 3) > 0.5 ? 1 : -1;
  const px = -dy / len, py = dx / len;
  // lateral offset between strands (hair separation)
  const off = (hash(seed + 7) - 0.5) * Math.min(10, len * 0.05);
  const cx = (ax + bx) * 0.5 + px * bulge * sign + px * off;
  const cy = (ay + by) * 0.5 + py * bulge * sign + py * off;
  // tiny endpoint jitter so strands don't share the exact same tip
  const j = Math.min(3.5, len * 0.012);
  const ax2 = ax + px * (hash(seed + 11) - 0.5) * j;
  const ay2 = ay + py * (hash(seed + 13) - 0.5) * j;
  const bx2 = bx + px * (hash(seed + 17) - 0.5) * j;
  const by2 = by + py * (hash(seed + 19) - 0.5) * j;

  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const u = 1 - t;
    pts.push(
      u * u * ax2 + 2 * u * t * cx + t * t * bx2,
      u * u * ay2 + 2 * u * t * cy + t * t * by2,
      0
    );
  }
  return pts;
}

/** Luminosité des liens : 0 = aucune lumière / liens invisibles, 1 = intensité max. */
function applyLinkLight(level = P.linkLight) {
  P.linkLight = Math.max(0, Math.min(1, level));
  const slider = document.getElementById('linkLight');
  if (slider && slider.value !== String(P.linkLight)) slider.value = String(P.linkLight);
  if (!lineGeo || !lineColorsBase || !lineMat) return;
  if (lineColorsDimmed && activeHashtag) {
    const col = lineGeo.attributes.color.array;
    const dim = 0.18;
    for (let i = 0; i < lineColorsBase.length; i++) col[i] = lineColorsBase[i] * P.linkLight * dim;
    lineGeo.attributes.color.needsUpdate = true;
    lineMat.opacity = P.linkLight * P.opacity * 0.45;
    lineMat.visible = P.linkLight > 0.0005;
    return;
  }
  const col = lineGeo.attributes.color.array;
  const k = P.linkLight;
  for (let i = 0; i < lineColorsBase.length; i++) col[i] = lineColorsBase[i] * k;
  lineGeo.attributes.color.needsUpdate = true;
  lineMat.opacity = k * P.opacity;
  lineMat.visible = k > 0.0005;
  lineColorsDimmed = false;
}

async function buildGraph(data, { onProgress, isCurrent } = {}) {
  const stillCurrent = () => !isCurrent || isCurrent();
  graphData = data;
  while (scene.children.length) scene.remove(scene.children[0]);
  labelsEl.innerHTML = '';
  labelItems = [];
  labelItemsBySize = [];

  const nodes = data.nodes;
  const edges = data.edges;
  const maxW = maxOf(edges, (e) => e.w || 0, 1);
  const useRtClasses = graphMode === 'rt_classes' && rtWeightByEdge;

  // Auto-tune hair density for large graphs (GPU/RAM + call-stack)
  if (edges.length > 200_000) {
    P.strands = 1;
    P.segments = 6;
  } else if (edges.length > 80_000) {
    P.strands = 2;
    P.segments = 8;
  } else if (edges.length > 30_000) {
    P.strands = 3;
    P.segments = 12;
  }

  const positions = [];
  const colors = [];
  // Index arêtes pour filtre # : désactivé sur très gros graphes (RAM)
  const storeEdgeEnds = edges.length <= 220_000;
  const edgeAForVert = storeEdgeEnds ? [] : null;
  const edgeBForVert = storeEdgeEnds ? [] : null;
  let seed = 1;
  const core = coreBounds(nodes, 0.05, 0.95);
  const CHUNK = edges.length > 100_000 ? 1800 : edges.length > 40_000 ? 2800 : 5000;

  // Ordre de dessin : RT (voile) → mixtes → interactions (devant).
  let edgeOrder = edges;
  if (useRtClasses) {
    const rank = { rt: 0, mix: 1, ix: 2 };
    edgeOrder = edges.map((e, i) => {
      const cls = rtEdgeClass(edgeRtFrac(e, rtWeightByEdge));
      return { e, i, cls, r: rank[cls] };
    }).sort((a, b) => a.r - b.r || a.i - b.i);
  }

  const nDraw = edgeOrder.length;
  for (let ei = 0; ei < nDraw; ei++) {
    if (!stillCurrent()) return false;
    const item = useRtClasses ? edgeOrder[ei] : null;
    const e = useRtClasses ? item.e : edgeOrder[ei];
    const a = nodes[e.s];
    const b = nodes[e.t];
    if (!a || !b) continue;
    // Skip long spokes to out-of-GEXF fallback nodes (they clip the viewport).
    if (!inCoreBounds(a, core) || !inCoreBounds(b, core)) continue;

    let ca, cb, bright;
    const wNorm = Math.pow(e.w / maxW, 0.45);
    if (useRtClasses) {
      const style = rtClassStyle(item.cls);
      ca = style.col;
      cb = style.col;
      bright = (0.28 + 0.55 * wNorm) * style.lumMul;
    } else {
      ca = lift(a.c, 1.18);
      cb = lift(b.c, 1.18);
      bright = 0.28 + 0.55 * wNorm;
    }

    for (let s = 0; s < P.strands; s++) {
      // outer strands slightly dimmer
      const strandBright = bright * (1 - s * 0.12);
      const pts = strandPoints(a.x, a.y, b.x, b.y, P.segments, seed++);
      const n = pts.length / 3;
      for (let i = 0; i < n - 1; i++) {
        const t0 = i / (n - 1);
        const t1 = (i + 1) / (n - 1);
        const c0 = useRtClasses ? ca : lerp3(ca, cb, t0);
        const c1 = useRtClasses ? cb : lerp3(ca, cb, t1);
        positions.push(
          pts[i * 3], pts[i * 3 + 1], pts[i * 3 + 2],
          pts[(i + 1) * 3], pts[(i + 1) * 3 + 1], pts[(i + 1) * 3 + 2]
        );
        colors.push(
          c0[0] * strandBright, c0[1] * strandBright, c0[2] * strandBright,
          c1[0] * strandBright, c1[1] * strandBright, c1[2] * strandBright
        );
        if (edgeAForVert) {
          edgeAForVert.push(e.s, e.s);
          edgeBForVert.push(e.t, e.t);
        }
      }
    }
    if (ei > 0 && ei % CHUNK === 0) {
      onProgress?.(ei / nDraw);
      await new Promise((r) => setTimeout(r, 0));
    }
  }
  if (!stillCurrent()) return false;
  onProgress?.(1);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  lineColorsBase = new Float32Array(colors);
  geo.setAttribute('color', new THREE.Float32BufferAttribute(lineColorsBase, 3));
  lineGeo = geo;
  if (edgeAForVert && edgeAForVert.length === colors.length / 3) {
    lineEdgeA = Int32Array.from(edgeAForVert);
    lineEdgeB = Int32Array.from(edgeBForVert);
  } else {
    lineEdgeA = null;
    lineEdgeB = null;
  }

  lineMat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
  });

  const lines = new THREE.LineSegments(geo, lineMat);
  lines.frustumCulled = false;
  scene.add(lines);
  applyLinkLight(P.linkLight);

  // Hubs : taille / opacité adaptées à la densité du corpus (sinon illisibles sur petits graphes).
  const n = nodes.length;
  const vis = graphVisualScale(n);
  const nPos = new Float32Array(n * 3);
  const nCol = new Float32Array(n * 3);
  const nSize = new Float32Array(n);
  const maxDeg = maxOf(nodes, (x) => x.deg || 1, 1);
  for (let i = 0; i < n; i++) {
    const nd = nodes[i];
    nPos[i * 3] = nd.x;
    nPos[i * 3 + 1] = nd.y;
    nPos[i * 3 + 2] = 0.15;
    const c = lift(nd.c, 1.1);
    nCol[i * 3] = c[0];
    nCol[i * 3 + 1] = c[1];
    nCol[i * 3 + 2] = c[2];
    nSize[i] = (0.4 + 2.2 * Math.sqrt((nd.deg || 1) / maxDeg)) * vis.nodeBoost;
    nd._displayC = nd.c;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(nCol, 3));
  pGeo.setAttribute('size', new THREE.BufferAttribute(nSize, 1));
  const pMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uPR: { value: renderer.getPixelRatio() },
      uAlpha: { value: vis.pointAlpha },
    },
    vertexShader: `
      attribute float size; attribute vec3 color;
      varying vec3 vC;
      uniform float uPR;
      void main() {
        vC = color;
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = size * uPR;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vC;
      uniform float uAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.45, 0.0, d) * uAlpha;
        gl_FragColor = vec4(vC, a);
        if (a < 0.01) discard;
      }`,
  });
  pointsMesh = new THREE.Points(pGeo, pMat);
  pointsMesh.frustumCulled = false;
  scene.add(pointsMesh);
  nodeColorsBase = new Float32Array(nCol);
  nodeSizesBase = new Float32Array(nSize);
  lineColorsDimmed = false;

  let modeLabel = data.meta?.interactions === 'rt' ? 'RT' : 'toutes interactions';
  if (graphMode === 'rt_classes') {
    modeLabel = rtWeightByEdge
      ? 'classes RT (ambre / magenta / bleu)'
      : 'classes RT indisponibles';
  }
  document.getElementById('stats').textContent =
    `${modeLabel} · ${data.meta.n_nodes.toLocaleString('fr-FR')} nœuds · ${data.meta.n_edges.toLocaleString('fr-FR')} liens · ${P.strands}× hair`;
  fitGraphToView(nodes);
  renderCommPanel(data);
  rebuildLabels();
  if (activeHashtag) {
    applyNodeHighlight({
      accounts: accountsForHashtag(activeHashtag),
      comms: communitiesForHashtag(activeHashtag),
    });
  } else applyNodeHighlight(null);
  return true;
}

function rebuildLabels() {
  labelsEl.innerHTML = '';
  labelItems = [];
  labelItemsBySize = [];
  lastLabelCamKey = '';
  if (!graphData) return;

  const pool = pickLabelPool(graphData.nodes, P.nLabels);
  if (!pool.length) return;

  // Contraste type Gephi, plafonné selon la taille du graphe (évite labels géants / nœuds invisibles).
  const vis = graphVisualScale(graphData.nodes.length);
  const sMin = minOf(pool, (n) => n.gephiSize, 1);
  const sMax = maxOf(pool, (n) => n.gephiSize, 1);
  const sSpan = Math.max(sMax - sMin, 1e-6);
  const fontSpan = Math.max(vis.labelMaxPx - vis.labelMinPx, 1);

  const ordered = [...pool].sort((a, b) => a.gephiSize - b.gephiSize);

  for (const item of ordered) {
    const node = item.node;
    const el = document.createElement('div');
    el.className = 'label';
    // Graphe = handles @ uniquement (jamais qualification / # / « espace »)
    const raw = String(node.l || '').replace(/^@+/, '').trim();
    if (!raw || /\s/.test(raw) || raw.startsWith('#')) continue;
    const text = `@${raw}`;
    el.textContent = text;

    const u = (item.gephiSize - sMin) / sSpan;
    const t = Math.pow(u, 0.7);
    const abs = Math.pow(item.gephiSize / sMax, 1.25);
    const mix = 0.45 * t + 0.55 * abs;
    const fontPx = Math.round(vis.labelMinPx + fontSpan * mix);

    el.style.fontSize = `${fontPx}px`;
    el.style.fontWeight = mix > 0.7 ? '700' : mix > 0.4 ? '600' : '500';
    el.style.zIndex = String(Math.round(10 + 90 * mix));
    el.style.opacity = '0.94';
    el.style.display = 'none';
    const displayC = node._displayC || node.c;
    const labelColor = rgbCss(displayC);
    el.style.color = labelColor;
    el.style.textShadow = '0 0 6px rgba(0,0,0,0.85), 0 1px 2px rgba(0,0,0,0.75)';
    el.title = `${text} — clic : profil X`;
    el.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      navigateFromNode(node);
    });
    labelsEl.appendChild(el);

    labelItems.push({
      el,
      text,
      nodeRef: node,
      x: node.x,
      y: node.y,
      pr: node.pr,
      deg: item.deg,
      gephiSize: item.gephiSize,
      fontPx,
      t: mix,
      boxW: Math.max(28, text.length * fontPx * 0.55 + 12),
      boxH: fontPx * 1.35,
      com: item.com,
      color: labelColor,
      rgb: displayC,
      visible: false,
      ox: 0,
      oy: 0,
    });
  }

  labelItemsBySize = [...labelItems].sort(
    (a, b) => (b.gephiSize - a.gephiSize) || (b.deg - a.deg)
  );
}

function labelScreenBox(cx, cy, boxW, boxH, ox, oy) {
  // CSS: left/top = node, then translate(-50%, -130%)
  // label top-left ≈ (cx - boxW/2 + ox, cy - 1.3*boxH + oy)
  const left = cx - boxW * 0.5 + ox;
  const top = cy - boxH * 1.3 + oy;
  return { left, top, right: left + boxW, bottom: top + boxH, w: boxW, h: boxH };
}

function boxesHit(a, b, pad = 6) {
  return !(
    a.right + pad <= b.left ||
    a.left - pad >= b.right ||
    a.bottom + pad <= b.top ||
    a.top - pad >= b.bottom
  );
}

function layoutVisibleLabels(w, h) {
  const z = camera.zoom || 1;
  const budget = labelRevealCount(z, fitZoom, P.nLabels, labelItems.length);
  if (budget <= 0 || !labelItemsBySize.length) return [];

  const hitPad = overlapPadForZoom(z, fitZoom);
  const inView = [];
  for (const it of labelItemsBySize) {
    _proj.set(it.x, it.y, 0).project(camera);
    if (_proj.z > 1) continue;
    const cx = (_proj.x * 0.5 + 0.5) * w;
    const cy = (-_proj.y * 0.5 + 0.5) * h;
    if (cx < -80 || cx > w + 80 || cy < -80 || cy > h + 80) continue;
    inView.push({ it, cx, cy });
  }

  const placed = [];
  const boxes = [];
  for (const { it, cx, cy } of inView) {
    if (placed.length >= budget) break;
    for (const [ox, oy] of labelOffsetOptions(it.boxW, it.boxH)) {
      const box = labelScreenBox(cx, cy, it.boxW, it.boxH, ox, oy);
      if (box.right < 4 || box.left > w - 4 || box.bottom < 4 || box.top > h - 4) continue;
      if (boxes.some((b) => boxesHit(box, b, hitPad))) continue;
      placed.push({ it, cx, cy, ox, oy, box });
      boxes.push(box);
      break;
    }
  }
  return placed;
}

function labelCamKey() {
  return `${(camera.zoom || 0).toFixed(5)}|${camera.position.x.toFixed(2)}|${camera.position.y.toFixed(2)}|${innerWidth}|${innerHeight}|${P.nLabels}`;
}

function projectLabels() {
  if (!labelItems.length) return;
  const key = labelCamKey();
  if (key === lastLabelCamKey) return;
  lastLabelCamKey = key;

  const placed = layoutVisibleLabels(innerWidth, innerHeight);
  const shown = new Set(placed.map((p) => p.it));

  for (const p of placed) {
    const it = p.it;
    it.visible = true;
    it.ox = p.ox;
    it.oy = p.oy;
    it.el.style.display = 'block';
    it.el.style.left = `${p.cx + p.ox}px`;
    it.el.style.top = `${p.cy + p.oy}px`;
  }
  for (const it of labelItems) {
    if (!shown.has(it) && it.visible) {
      it.visible = false;
      it.el.style.display = 'none';
    }
  }
}

function onResize() {
  const a = innerWidth / innerHeight;
  camera.left = -frustum * a;
  camera.right = frustum * a;
  camera.top = frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.resolution.set(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

document.getElementById('linkLight').oninput = (e) => { applyLinkLight(+e.target.value); };
document.getElementById('bloom').oninput = (e) => { bloomPass.strength = +e.target.value; P.bloom = +e.target.value; };
document.getElementById('op').oninput = (e) => { P.opacity = +e.target.value; applyLinkLight(P.linkLight); };

const exportBtn = document.getElementById('exportBtn');
const exportStatus = document.getElementById('exportStatus');
let exporting = false;

function parseExportSize(val) {
  if (val === 'screen') {
    const pr = Math.min(devicePixelRatio, 2);
    return {
      w: Math.round(innerWidth * pr * 2),
      h: Math.round(innerHeight * pr * 2),
    };
  }
  const [w, h] = val.split('x').map(Number);
  return { w, h };
}

function maxGpuSize() {
  const gl = renderer.getContext();
  const a = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || 8192;
  const b = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 8192;
  // leave headroom for bloom mip chain
  return Math.min(a, b, 8192);
}

function drawLabelsOnCtx(ctx, w, h, scale) {
  if (!labelItemsBySize.length) return;
  const z = camera.zoom || 1;
  const budget = labelRevealCount(z, fitZoom, P.nLabels, labelItemsBySize.length);
  if (budget <= 0) return;
  const hitPad = overlapPadForZoom(z, fitZoom);
  const placed = [];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';

  const paint = (it, cx, cy, ox, oy, fontPx, text) => {
    const weight = (it.t || 0) > 0.7 ? '700' : (it.t || 0) > 0.4 ? '600' : '500';
    ctx.font = `${weight} ${fontPx}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    ctx.globalAlpha = 0.94;
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = it.color || rgbCss(it.rgb) || '#ffffff';
    ctx.fillText(text, cx + ox, cy + oy - fontPx * 0.25);
    ctx.shadowBlur = 0;
  };

  let shown = 0;
  for (const it of labelItemsBySize) {
    if (shown >= budget) break;
    _proj.set(it.x, it.y, 0).project(camera);
    if (_proj.z > 1) continue;
    const cx = (_proj.x * 0.5 + 0.5) * w;
    const cy = (-_proj.y * 0.5 + 0.5) * h;
    if (cx < -80 || cx > w + 80 || cy < -80 || cy > h + 80) continue;
    const fontPx = Math.max(10, Math.round((it.fontPx || 12) * scale));
    const text = it.text || it.el.textContent;
    const boxW = Math.max(28, text.length * fontPx * 0.55 + 12);
    const boxH = fontPx * 1.35;

    for (const [ox, oy] of labelOffsetOptions(boxW, boxH)) {
      const box = labelScreenBox(cx, cy, boxW, boxH, ox, oy);
      if (box.right < 4 || box.left > w - 4 || box.bottom < 4 || box.top > h - 4) continue;
      if (placed.some((p) => boxesHit(box, p, hitPad))) continue;
      paint(it, cx, cy, ox, oy, fontPx, text);
      placed.push(box);
      shown++;
      break;
    }
  }
  ctx.globalAlpha = 1;
}

/** Read WebGL default framebuffer → ImageData (Y-flipped for 2D canvas). */
function readGlToImageData(w, h) {
  const gl = renderer.getContext();
  const bw = gl.drawingBufferWidth;
  const bh = gl.drawingBufferHeight;
  if (bw < 1 || bh < 1) throw new Error('drawingBuffer vide');

  const pixels = new Uint8Array(bw * bh * 4);
  // ensure pending GPU cmds flushed into default FB
  renderer.getContext().finish?.();
  gl.readPixels(0, 0, bw, bh, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

  // sanity: count non-black pixels
  let lit = 0;
  for (let i = 0; i < pixels.length; i += 16) {
    if (pixels[i] > 2 || pixels[i + 1] > 2 || pixels[i + 2] > 2) lit++;
  }
  if (lit < 8) {
    throw new Error('framebuffer quasi-noir (bloom/GPU?)');
  }

  const img = new ImageData(bw, bh);
  // flip Y (GL origin = bottom-left)
  const row = bw * 4;
  for (let y = 0; y < bh; y++) {
    const src = (bh - 1 - y) * row;
    img.data.set(pixels.subarray(src, src + row), y * row);
  }
  return { img, bw, bh };
}

function applyExportCamera(prev, w, h) {
  const halfW = ((prev.right - prev.left) * 0.5) / prev.zoom;
  const halfH = ((prev.top - prev.bottom) * 0.5) / prev.zoom;
  const exportAspect = w / h;
  let expHalfW;
  let expHalfH;
  if (halfW / halfH > exportAspect) {
    expHalfW = halfW;
    expHalfH = halfW / exportAspect;
  } else {
    expHalfH = halfH;
    expHalfW = halfH * exportAspect;
  }
  camera.left = -expHalfW;
  camera.right = expHalfW;
  camera.top = expHalfH;
  camera.bottom = -expHalfH;
  camera.zoom = 1;
  camera.updateProjectionMatrix();
}

async function renderExportFrame(w, h, useBloom) {
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.setRenderTarget(null);
  renderer.clear();

  if (useBloom) {
    composer.setSize(w, h);
    bloomPass.resolution.set(w, h);
    // force last pass onto default framebuffer
    composer.renderToScreen = true;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }

  // double rAF so buffer is ready
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return readGlToImageData(w, h);
}

async function exportPng() {
  if (exporting || !graphData) return;
  exporting = true;
  exportBtn.disabled = true;

  const { w: wantW, h: wantH } = parseExportSize(document.getElementById('exportSize').value);
  const maxS = maxGpuSize();
  let w = wantW;
  let h = wantH;
  // soft cap: bloom needs ~2–4× memory; stay safer on big graphs
  const softCap = graphData.edges.length > 50_000 ? 4096 : 6144;
  const cap = Math.min(maxS, softCap);
  if (Math.max(w, h) > cap) {
    const s = cap / Math.max(w, h);
    w = Math.max(1, Math.floor(w * s));
    h = Math.max(1, Math.floor(h * s));
    exportStatus.textContent = `Plafond ${cap}px → ${w}×${h}…`;
  } else {
    exportStatus.textContent = `Rendu ${w}×${h}…`;
  }

  const prev = {
    pr: renderer.getPixelRatio(),
    cssW: innerWidth,
    cssH: innerHeight,
    left: camera.left,
    right: camera.right,
    top: camera.top,
    bottom: camera.bottom,
    zoom: camera.zoom,
  };

  try {
    await new Promise((r) => requestAnimationFrame(r));
    controls.update();
    applyExportCamera(prev, w, h);

    let frame;
    try {
      exportStatus.textContent = `Rendu bloom ${w}×${h}…`;
      frame = await renderExportFrame(w, h, true);
    } catch (e1) {
      console.warn('export bloom failed, fallback sans bloom', e1);
      exportStatus.textContent = `Fallback sans bloom ${w}×${h}…`;
      // shrink further if needed
      if (Math.max(w, h) > 4096) {
        const s = 4096 / Math.max(w, h);
        w = Math.floor(w * s);
        h = Math.floor(h * s);
        applyExportCamera(prev, w, h);
      }
      frame = await renderExportFrame(w, h, false);
    }

    const { img, bw, bh } = frame;
    const out = document.createElement('canvas');
    out.width = bw;
    out.height = bh;
    const ctx = out.getContext('2d');
    ctx.putImageData(img, 0, 0);

    const labelScale = Math.max(bw, bh) / 1400;
    drawLabelsOnCtx(ctx, bw, bh, labelScale);

    exportStatus.textContent = `Encodage PNG ${bw}×${bh}…`;
    await new Promise((r) => requestAnimationFrame(r));

    const blob = await new Promise((resolve, reject) => {
      out.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png');
    });

    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = `connectome_${bw}x${bh}_${stamp}.png`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    const mb = (blob.size / (1024 * 1024)).toFixed(1);
    exportStatus.textContent = `OK · ${name} · ${mb} Mo`;
  } catch (err) {
    console.error(err);
    exportStatus.textContent = `Erreur: ${err.message || err}`;
  } finally {
    camera.left = prev.left;
    camera.right = prev.right;
    camera.top = prev.top;
    camera.bottom = prev.bottom;
    camera.zoom = prev.zoom;
    camera.updateProjectionMatrix();
    renderer.setRenderTarget(null);
    renderer.setPixelRatio(prev.pr);
    renderer.setSize(prev.cssW, prev.cssH, true);
    composer.setSize(prev.cssW, prev.cssH);
    bloomPass.resolution.set(prev.cssW, prev.cssH);
    composer.renderToScreen = true;
    exporting = false;
    exportBtn.disabled = false;
  }
}

exportBtn.addEventListener('click', () => { exportPng(); });

(function loop() {
  requestAnimationFrame(loop);
  if (exporting) return;
  controls.update();
  composer.render();
  projectLabels();
})();

async function loadCorpus(corp) {
  const seq = ++loadSeq;
  const isCurrent = () => seq === loadSeq;
  currentCorpusId = corp.id;
  selectedCommId = null;
  activeHashtag = null;
  espaceFicheEl?.classList.remove('open');
  updateGraphModeButtons();
  syncCorpusUrl(corp.id);
  hideBootSplash();
  const modeBit = graphMode === 'rt' ? 'RT · '
    : graphMode === 'rt_classes' ? 'Classes RT · ' : '';
  const cached = graphCache.has(cacheKeyFor(corp.id, graphMode));
  setGraphLoader({
    title: corp.label,
    msg: cached ? 'Mise en scène…' : `Téléchargement · ${modeBit}graphe…`,
    progress: cached ? 0.05 : 0,
    indeterminate: !cached,
  });
  setCommLoading(true, 'Chargement des communautés…');
  [...tabsEl.querySelectorAll('.tab')].forEach((b) => {
    b.classList.toggle('active', b.dataset.id === corp.id);
  });
  syncCorpusSubTabs(corp);
  prefetchAnalysesAssets(corp.id);
  try {
    const pubsPromise = graphMode === 'rt' ? Promise.resolve(null) : ensurePubStats(corp.id);
    const discPromise = ensureDiscourse(corp.id);
    const fetchMode = graphMode === 'rt_classes' ? 'all' : graphMode;
    const data = await ensureGraphData(corp, fetchMode, {
      onProgress: (p, received, total) => {
        if (!isCurrent()) return;
        if (p == null) {
          setGraphLoader({
            title: corp.label,
            msg: `Lecture · ${modeBit}${corp.label}…`,
            indeterminate: true,
          });
          return;
        }
        const mb = total ? ` · ${(received / 1e6).toFixed(1)}/${(total / 1e6).toFixed(1)} Mo` : '';
        setGraphLoader({
          title: corp.label,
          msg: `Téléchargement${mb}`,
          progress: 0.72 * p,
          indeterminate: false,
        });
      },
    });
    if (!isCurrent()) return;

    rtWeightByEdge = null;
    if (graphMode === 'rt_classes') {
      setGraphLoader({
        title: corp.label,
        msg: 'Alignement poids RT…',
        progress: 0.73,
        indeterminate: true,
      });
      try {
        const rtData = await ensureGraphData(corp, 'rt', {
          onProgress: (p) => {
            if (!isCurrent() || p == null) return;
            setGraphLoader({
              title: corp.label,
              msg: 'Téléchargement graphe RT…',
              progress: 0.72 + 0.08 * p,
              indeterminate: false,
            });
          },
        });
        if (!isCurrent()) return;
        rtWeightByEdge = buildRtWeightMap(data, rtData);
      } catch (err) {
        console.warn('Classes RT indisponibles (graph_rt.json)', err);
        rtWeightByEdge = null;
      }
    }

    const [pubs, disc] = await Promise.all([pubsPromise, discPromise]);
    if (!isCurrent()) return;
    discourseData = disc;
    if (pubs) {
      data.meta = data.meta || {};
      data.meta.pubStats = pubs;
    }
    if (disc) {
      data.meta = data.meta || {};
      data.meta.discourse = disc;
    }
    setCommLoading(false);

    const nE = (data.edges || []).length;
    setGraphLoader({
      title: corp.label,
      msg: `Construction 3D · ${nE.toLocaleString('fr-FR')} liens…`,
      progress: 0.74,
      indeterminate: false,
    });
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    if (!isCurrent()) return;

    // reset hair density defaults before auto-tune in buildGraph
    P.strands = 4;
    P.segments = 18;
    pointsMesh = null;
    const ok = await buildGraph(data, {
      isCurrent,
      onProgress: (p) => {
        if (!isCurrent()) return;
        setGraphLoader({
          title: corp.label,
          msg: `Construction 3D · ${Math.round(p * 100)} %`,
          progress: 0.74 + 0.26 * p,
          indeterminate: false,
        });
      },
    });
    if (!ok || !isCurrent()) return;

    document.title = graphMode === 'rt'
      ? `Connectome RT — ${corp.label}`
      : graphMode === 'rt_classes'
        ? `Connectome · Classes RT — ${corp.label}`
        : `Connectome — ${corp.label}`;
    hideGraphLoader();
    idle(600).then(() => warmBackgroundCaches(corp.id));
  } catch (err) {
    if (!isCurrent()) return;
    setCommLoading(false);
    setGraphLoader({
      title: corp.label,
      msg: String(err?.message || err),
      progress: 0,
      indeterminate: false,
    });
  }
}

function setupTooltip() {
  let ptrDown = null;
  let hoverNode = null;

  renderer.domElement.style.cursor = 'grab';

  renderer.domElement.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    ptrDown = { x: ev.clientX, y: ev.clientY };
    renderer.domElement.style.cursor = 'grabbing';
  });

  const endPtr = () => {
    ptrDown = null;
    renderer.domElement.style.cursor = hoverNode ? 'pointer' : 'grab';
  };
  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (!ptrDown || ev.button !== 0) {
      endPtr();
      return;
    }
    const dx = ev.clientX - ptrDown.x;
    const dy = ev.clientY - ptrDown.y;
    const moved = (dx * dx + dy * dy) > 36;
    ptrDown = null;
    renderer.domElement.style.cursor = hoverNode ? 'pointer' : 'grab';
    if (moved) return;
    const node = hitTestNode(ev.clientX, ev.clientY);
    if (!node) return;
    navigateFromNode(node);
  });
  renderer.domElement.addEventListener('pointercancel', endPtr);

  renderer.domElement.addEventListener('mousemove', (ev) => {
    if (!graphData) return;
    const best = hitTestNode(ev.clientX, ev.clientY);
    hoverNode = best;
    if (!ptrDown) renderer.domElement.style.cursor = best ? 'pointer' : 'grab';
    if (!best) {
      tip.style.display = 'none';
      return;
    }
    const handle = displayHandle(best.l);
    tip.innerHTML =
      `<strong>${handle}</strong>` +
      `<div class="muted">comm. C${best.com} · deg ${Math.round(best.deg || 0)} · PR ${(best.pr || 0).toExponential(2)}</div>` +
      `<div class="hint">Clic → profil X</div>`;
    tip.style.display = 'block';
    tip.style.left = `${Math.min(ev.clientX + 14, innerWidth - 300)}px`;
    tip.style.top = `${Math.min(ev.clientY + 14, innerHeight - 100)}px`;
  });
  renderer.domElement.addEventListener('mouseleave', () => {
    tip.style.display = 'none';
    hoverNode = null;
    if (!ptrDown) renderer.domElement.style.cursor = 'grab';
  });
}

async function boot() {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
    }
  } catch (_) { /* ignore */ }
  setupTooltip();
  hideBootSplash();
  let corpora = [
    { id: 'ebola', label: 'Ebola', connectomeData: './data/ebola/graph.json' },
    { id: 'ebola_2_2026', label: 'Ebola 2 · 2026', connectomeData: './data/ebola_2_2026/graph.json' },
    { id: 'hantavirus', label: 'Hantavirus', connectomeData: './data/hantavirus/graph.json' },
    { id: 'mpox', label: 'Mpox', connectomeData: './data/mpox/graph.json' },
    { id: 'macron_nucleaire', label: 'Macron nucléaire', connectomeData: './data/macron_nucleaire/graph.json' },
    { id: 'hmpv', label: 'HMPV · 2025', connectomeData: './data/hmpv/graph.json' },
    { id: 'hmpv_fr', label: 'HMPV FR · 2025', connectomeData: './data/hmpv_fr/graph.json' },
    { id: 'canicule', label: 'Canicule · mai–juin 2026', connectomeData: './data/canicule/graph.json' },
  ];
  try {
    const m = await fetch(new URL('./manifest.json', import.meta.url)).then((r) => r.json());
    if (m.corpora?.length) corpora = m.corpora;
    if (m.defaults?.linkLight != null) {
      P.linkLight = m.defaults.linkLight;
      document.getElementById('linkLight').value = String(P.linkLight);
    }
    if (m.defaults?.opacity != null) {
      P.opacity = m.defaults.opacity;
      document.getElementById('op').value = String(P.opacity);
    }
    applyLinkLight(P.linkLight);
    if (m.defaults?.bloom != null) {
      P.bloom = m.defaults.bloom;
      document.getElementById('bloom').value = String(P.bloom);
      bloomPass.strength = P.bloom;
    }
    if (m.defaults?.labels != null) {
      P.nLabels = m.defaults.labels;
      document.getElementById('nLabels').value = String(P.nLabels);
    }
  } catch (_) { /* fallback list */ }

  corporaList = corpora;
  const health3 = document.getElementById('health3Link');
  tabsEl.querySelectorAll('button.tab').forEach((b) => b.remove());
  for (const corp of corpora) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.dataset.id = corp.id;
    b.textContent = corp.label;
    b.addEventListener('click', () => loadCorpus(corp));
    b.addEventListener('pointerenter', () => {
      // Soft warm on hover: current mode only.
      ensureGraphData(corp, graphMode).catch(() => {});
      ensurePubStats(corp.id).catch(() => {});
      prefetchAnalysesAssets(corp.id);
    }, { passive: true });
    tabsEl.insertBefore(b, health3);
  }
  // Deep-link: ?corpus=ebola&graph=rt&view=analyses
  updateGraphModeButtons();
  document.querySelectorAll('#graphMode button.mode[data-graph]').forEach((b) => {
    b.addEventListener('click', () => setGraphMode(b.dataset.graph));
  });
  document.querySelectorAll('#colorModeBtns .color-btn').forEach((b) => {
    b.addEventListener('click', () => setEdgeColorFromHud(b.dataset.mode));
  });
  hashModeBtn?.addEventListener('click', () => {
    if (viewMode === 'analyses') setViewMode('graph');
    else setViewMode('analyses');
    updateGraphModeButtons();
  });
  hashModeBtn?.addEventListener('pointerenter', () => {
    prefetchAnalysesAssets(currentCorpusId);
  }, { passive: true });
  const start = resolveCorpus(new URLSearchParams(location.search).get('corpus')) || corpora[0];
  // Kick fetch immediately (overlaps with UI wiring); then render.
  const kick = ensureGraphData(start, graphMode).catch(() => null);
  ensurePubStats(start.id).catch(() => null);
  ensureDiscourse(start.id).catch(() => null);
  await kick;
  await loadCorpus(start);
  if (viewMode === 'analyses') {
    setViewMode('analyses');
    updateGraphModeButtons();
  }
}

window.addEventListener('popstate', () => {
  if (!corporaList.length) return;
  const params = new URLSearchParams(location.search);
  const g = params.get('graph');
  const nextMode = (g === 'rt' || g === 'rt_classes') ? g : 'all';
  const nextView = params.get('view') === 'analyses' ? 'analyses' : 'graph';
  const corp = resolveCorpus(params.get('corpus')) || corporaList[0];
  const modeChanged = nextMode !== graphMode;
  const viewChanged = nextView !== viewMode;
  graphMode = nextMode;
  if (viewChanged) setViewMode(nextView, { syncUrl: false });
  updateGraphModeButtons();
  if (modeChanged || corp.id !== currentCorpusId) loadCorpus(corp);
});

boot();
  </script>
